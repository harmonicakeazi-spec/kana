@media (prefers-color-scheme: dark) {
  :root {
    --s-paper: #1A1715; --s-card: #24201D; --s-ink: #F1ECE4; --s-muted: #A89E92;
    --s-line: #3A332D; --s-accent: #9DB8D6; --s-accent-soft: #2A3442; --s-chip: rgba(36,32,29,.82);

  }
}
html, body { margin: 0; }
body {
  background: var(--s-paper); color: var(--s-ink);
  font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Hiragino Sans", sans-serif;
  font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%;
}
.app[hidden], #home[hidden] { display: none; }
#home { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
#home .hero {
  position: relative; max-width: 560px; margin: 0 auto;
  aspect-ratio: 780 / 521; background: center / cover no-repeat;
  -webkit-mask-image: linear-gradient(#000 70%, transparent);
  mask-image: linear-gradient(#000 70%, transparent);
}
@media (prefers-color-scheme: dark) { #home .hero { filter: brightness(.62) saturate(.9); } }
#home .wrap { max-width: 520px; margin: -64px auto 0; padding: 0 18px; position: relative; }
#home h1 {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Noto Serif CJK TC", serif;
  font-size: 34px; font-weight: 600; letter-spacing: .08em; margin: 0;
}
#home .sub { color: var(--s-muted); margin: 4px 0 22px; }
#home .course {
  width: 100%; text-align: left; font: inherit; cursor: pointer;
  display: flex; gap: 14px; align-items: flex-start; text-decoration: none; color: inherit;
  background: var(--s-card); border: 2px solid var(--s-line); border-radius: 20px;
  padding: 16px; margin-bottom: 12px;
}
#home .course:focus-visible { outline: 3px solid var(--s-accent); outline-offset: 2px; }
#home .step {
  flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--s-accent); color: var(--s-paper); font-size: 18px; font-weight: 600;
}
#home .course .ct { display: block; font-size: 18px; font-weight: 700; margin: 0 0 2px; }
#home .course .cd { display: block; margin: 0; color: var(--s-muted); font-size: 14px; }
#home .course .go { margin-left: auto; align-self: center; color: var(--s-muted); font-size: 22px; }
#home .settings { margin-top: 22px; border-top: 2px solid var(--s-line); padding-top: 16px; }
#home .settings h3 { font-size: 15px; margin: 0 0 8px; }
#home .vrow { display: flex; gap: 8px; }
#home select {
  flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 9px 10px; border-radius: 12px;
  border: 2px solid var(--s-line); background: var(--s-card); color: var(--s-ink);
}
#home .vbtn {
  font: inherit; font-size: 15px; padding: 9px 16px; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--s-line); background: var(--s-card); color: var(--s-ink);
}
#home .note { color: var(--s-muted); font-size: 13px; margin: 8px 0 0; }

/* ===== 課程一：日文聲音練習簿 ===== */
#sndApp {
  --paper:#FAF7F1;--card:#FFFDF9;--ink:#2D2A2E;--ink2:#7D7468;--grid:#DCD2C4;--wash:#EFE9E0;--stamp:#B4493C;--accent:#3F6189;
  --chip:rgba(255,253,249,.8);--veil:rgba(250,247,241,0);
  color-scheme:light;
}
@media (prefers-color-scheme:dark) {
#sndApp {--paper:#1A1715;--card:#24201D;--ink:#F1ECE4;--ink2:#A89E92;--grid:#3F372F;--wash:#2D2824;--stamp:#EE958A;--accent:#9DB8D6;--chip:rgba(36,32,29,.8);--veil:rgba(26,23,21,.5);color-scheme:dark}
}
#sndApp, #sndApp * {box-sizing:border-box}
#sndApp {margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
#sndApp .jp {font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP","Source Han Serif JP",serif}
#sndApp .serif {font-family:"Songti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU",serif}
#sndApp button {font:inherit;color:inherit}
#sndApp :focus-visible {outline:2px solid var(--ink);outline-offset:2px}
#sndApp .bar {position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--grid)}
#sndApp .back {background:none;border:0;padding:6px 4px;font-size:15px;cursor:pointer}
#sndApp .bar-title {flex:1;font-weight:600}
#sndApp .speed {font-size:14px;color:var(--ink2);display:flex;gap:6px;align-items:center}
#sndApp .speed select {font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--grid);border-radius:4px;padding:2px 4px}
#sndApp main {max-width:640px;margin:0 auto;padding:16px 16px 56px}
#sndApp .hero {padding:0 0 4px}
#sndApp .band {margin:0 -16px 14px;padding:16px 16px 18px;border-radius:0 0 28px 28px;
  background:linear-gradient(var(--veil),var(--veil)),var(--snow-bg) center 35%/cover}
#sndApp .band-row {display:flex;align-items:center;gap:12px;margin-top:12px}
#sndApp .band-bird {width:128px;flex:none;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent),linear-gradient(transparent,#000 10%,#000 90%,transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent),linear-gradient(transparent,#000 10%,#000 90%,transparent);
  mask-composite:intersect}
@media (prefers-color-scheme:dark) {
#sndApp .band-bird {filter:brightness(.6) saturate(.9)}
}
#sndApp .band .lead {margin:0;padding:10px 12px;border-radius:14px;background:var(--chip);color:var(--ink);font-size:15px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#sndApp .title-cells {display:flex;flex-wrap:wrap}
#sndApp .title-cells span {width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--grid);margin-left:-1px;font-size:25px;font-weight:600;background:var(--card)}
#sndApp .title-cells span:first-child {margin-left:0}
#sndApp .lead {margin:16px 0 12px;max-width:34em;color:var(--ink2)}
#sndApp .title-cells span {background:var(--chip)}
#sndApp .voice {font-size:14px;padding:10px 12px;border-left:3px solid var(--grid);background:var(--wash);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
#sndApp .voice p {margin:0;flex:1 1 220px}
#sndApp .h2 {font-size:17px;margin:28px 0 10px}
#sndApp .path {list-style:none;margin:0;padding:0;border-top:1px solid var(--grid)}
#sndApp .path li button {width:100%;display:flex;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--grid);padding:14px 2px;cursor:pointer}
#sndApp .path .num {width:36px;height:36px;flex:none;display:grid;place-items:center;border:1px solid var(--grid);font-size:18px;background:var(--card)}
#sndApp .path .txt {flex:1;display:flex;flex-direction:column}
#sndApp .path .txt span {font-size:14px;color:var(--ink2)}
#sndApp .path .stat {font-size:13px;color:var(--ink2);white-space:nowrap}
#sndApp .foot {font-size:14px;color:var(--ink2);margin-top:18px}
#sndApp .linkbtn {background:none;border:0;padding:0;text-decoration:underline;color:var(--ink2);font-size:13px;cursor:pointer}
#sndApp .btn {border:1.5px solid var(--ink);background:transparent;border-radius:4px;padding:8px 16px;cursor:pointer;font-size:15px;min-height:44px}
#sndApp .btn.pri {background:var(--accent);border-color:var(--accent);color:var(--paper)}
#sndApp .btn:disabled {opacity:.4;cursor:default}
#sndApp .btn.rec {border-color:var(--stamp);color:var(--stamp)}
#sndApp .row {display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
#sndApp .card {background:var(--card);border:1px solid var(--grid);border-radius:6px;padding:18px 16px;margin:12px 0}
#sndApp .prompt {font-size:18px;margin:0 0 4px}
#sndApp .kind {font-size:13px;color:var(--ink2);margin:0 0 2px}
#sndApp .muted {color:var(--ink2)}
#sndApp .small {font-size:14px}
#sndApp .hint {color:var(--ink2);margin:0 0 12px;font-size:15px}
#sndApp .seg {display:flex;margin-bottom:14px;flex-wrap:wrap}
#sndApp .seg button {border:1px solid var(--grid);background:var(--card);padding:8px 14px;margin-left:-1px;cursor:pointer;font-size:15px}
#sndApp .seg button:first-child {margin-left:0}
#sndApp .seg button.on {background:var(--ink);color:var(--paper);border-color:var(--ink);position:relative;z-index:1}
#sndApp .chips {display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#sndApp .chip {border:1px solid var(--grid);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
#sndApp .chip.on {background:var(--ink);color:var(--paper);border-color:var(--ink)}
#sndApp .kgrid {display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:1px;background:var(--grid);border:1px solid var(--grid);max-width:420px}
#sndApp .kc {aspect-ratio:1;background:var(--card);border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:clamp(22px,7vw,30px);line-height:1.1;padding:0}
#sndApp .kc small {font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;font-size:12px;color:var(--ink2);margin-top:3px}
#sndApp .kc.empty {background:var(--wash)}
#sndApp .kc.on {background:var(--ink);color:var(--paper)}
#sndApp .kc.on small {color:var(--paper)}
#sndApp .tip {margin-top:16px;padding:14px 16px;border-left:3px solid var(--ink);background:var(--card)}
#sndApp .tip-head {display:flex;gap:16px;align-items:center}
#sndApp .big {font-size:56px;line-height:1}
#sndApp .roma {font-size:18px;margin:0;letter-spacing:.02em}
#sndApp .tip p {margin:6px 0}
#sndApp .cells {display:flex;flex-wrap:wrap;row-gap:12px;margin:14px 0 4px}
#sndApp .mc {display:flex;flex-direction:column;align-items:center;margin-left:-1px}
#sndApp .mc:first-child, #sndApp .gap+.mc {margin-left:0}
#sndApp .cell {width:var(--c);height:var(--c);display:grid;place-items:center;border:1px solid var(--grid);background:var(--card);font-size:calc(var(--c) * .55);padding:0;cursor:pointer;color:var(--ink)}
#sndApp div.cell, #sndApp .cell:disabled {cursor:default;color:var(--ink)}
#sndApp .mc.sp .cell {background:var(--wash)}
#sndApp .lab {font-size:12px;color:var(--ink2);min-height:18px;margin-top:3px;text-align:center}
#sndApp .tag {display:block;font-size:11px;padding:0 4px;border:1px solid var(--ink2);border-radius:3px;margin-top:2px;white-space:nowrap}
#sndApp .mc.beat .cell {background:var(--ink);color:var(--paper)}
#sndApp .gap {width:14px}
#sndApp .pitch {color:var(--ink);display:block;margin-top:2px}
#sndApp .choices {display:grid;gap:8px;margin:16px 0 4px}
#sndApp .choices.nums {grid-template-columns:repeat(6,1fr)}
#sndApp .choices.grid4 {grid-template-columns:repeat(2,1fr)}
#sndApp .choices.list {grid-template-columns:1fr}
#sndApp .ch {min-height:56px;border:1.5px solid var(--grid);background:var(--card);border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;font-size:22px}
#sndApp .ch:disabled {cursor:default;color:var(--ink)}
#sndApp .ch .jp {font-size:26px;line-height:1.25}
#sndApp .ch small {font-size:13px;color:var(--ink2)}
#sndApp .ch.right, #sndApp .opt.right {border-color:var(--stamp);box-shadow:inset 0 0 0 1.5px var(--stamp)}
#sndApp .ch.wrong, #sndApp .opt.wrong {opacity:.45}
#sndApp .pair {display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
#sndApp .opt {border:1.5px solid var(--grid);border-radius:6px;background:var(--card);display:flex;flex-direction:column;overflow:hidden}
#sndApp .opt-main {background:none;border:0;padding:14px 8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
#sndApp .opt-main:disabled {cursor:default;color:var(--ink)}
#sndApp .opt-main .jp.kana {font-size:28px;line-height:1.2}
#sndApp .opt-main .kanji {font-size:20px}
#sndApp .opt-main small {font-size:13px;color:var(--ink2)}
#sndApp .pw {display:inline-block}
#sndApp .pw .cells {margin:4px 0 0}
#sndApp .opt .mini {border:0;border-top:1px solid var(--grid);background:var(--wash);padding:9px;font-size:14px;cursor:pointer}
#sndApp .res {display:flex;gap:14px;align-items:center;margin-top:16px}
#sndApp .res p {margin:0}
#sndApp .stamp {display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;flex:none;animation:press .22s ease-out}
#sndApp .stamp.ok {border:3px solid var(--stamp)}
#sndApp .stamp.no {color:var(--ink2);font-size:30px}
@keyframes press {from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce) {
#sndApp .stamp {animation:none}
}
#sndApp .err {color:var(--stamp);font-size:14px}
#sndApp .switch {display:flex;gap:8px;align-items:center;font-size:14px;margin:10px 0;color:var(--ink2)}
#sndApp details.steps {margin-top:14px;font-size:14px;color:var(--ink2)}
#sndApp details.steps summary {cursor:pointer}
#sndApp details.steps ol {padding-left:20px;margin:8px 0 0}
/* ===== 課程二：五十音練習 ===== */
#kanaApp {
  --snow: #FAF7F1;      
  --surface: #FFFDF9;
  --ice: #EFE9E0;       
  --ink: #2D2A2E;       
  --muted: #7D7468;
  --line: #E4DCD0;
  --ai: #3F6189;        
  --ai-soft: #E6ECF2;
  --berry: #B4493C;     
  --berry-soft: #F6E4DF;
  --pine: #4E7A55;      
  --pine-soft: #E4EEE2;
  --wing: #C49A8C;
  --on-ai: #FFFFFF;
  --chip: rgba(255, 253, 249, .78);
  --veil: rgba(250, 247, 241, 0);
  --ok: var(--pine); --ok-soft: var(--pine-soft); --ng: var(--berry); --ng-soft: var(--berry-soft);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
#kanaApp {
    --snow: #1A1715; --surface: #24201D; --ice: #2D2824; --ink: #F1ECE4; --muted: #A89E92;
    --line: #3A332D; --ai: #9DB8D6; --ai-soft: #2A3442; --berry: #EE958A; --berry-soft: #3B2724;
    --pine: #9CC79F; --pine-soft: #24322A; --wing: #D2AE9F; --on-ai: #1A1715;
    --chip: rgba(36, 32, 29, .8);
    --veil: rgba(26, 23, 21, .5);
    --bird-dim: brightness(.56) saturate(.9);
    color-scheme: dark;
  }
}
#kanaApp, #kanaApp * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
#kanaApp, #kanaApp { margin: 0; }
#kanaApp {
  background: var(--snow); color: var(--ink);
  font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Hiragino Sans", sans-serif;
  font-size: 16px; line-height: 1.5;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
#kanaApp .kana-font { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Noto Serif CJK JP", "Source Han Serif JP", serif; }
#kanaApp .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px 48px; }
#kanaApp button:focus-visible { outline: 3px solid var(--ai); outline-offset: 2px; }
#kanaApp .top {
  margin: 0 -16px 16px; padding: 18px 16px 14px;
  background:
    linear-gradient(var(--veil), var(--veil)),
    var(--snow-bg) center 35% / cover;
  border-radius: 0 0 28px 28px;
}
#kanaApp .top h1 {
  text-shadow: 0 0 12px var(--snow);
  font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "PingFang TC", sans-serif;
  font-size: 22px; font-weight: 700; margin: 0; letter-spacing: .04em;
}
#kanaApp .perch { display: flex; align-items: center; gap: 12px; margin: 10px 0 14px; }
#kanaApp .mascot { width: 150px; flex-shrink: 0; }
#kanaApp .mascot img {
  width: 100%; height: auto; display: block;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent), linear-gradient(transparent, #000 8%, #000 92%, transparent);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent), linear-gradient(transparent, #000 8%, #000 92%, transparent);
  mask-composite: intersect;
  filter: var(--bird-dim, none);
}
#kanaApp .mascot.hop { animation: hop .45s ease-out; }
#kanaApp .mascot.shake { animation: shake .4s ease-in-out; }
@keyframes shake { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
@keyframes hop { 30% { transform: translateY(-10px); } 60% { transform: translateY(0); } 80% { transform: translateY(-3px); } }
#kanaApp .bubble {
  position: relative; flex: 1; background: var(--chip); border-radius: 18px;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  padding: 10px 14px; font-size: 15px; min-height: 44px;
}
#kanaApp .bubble::before {
  content: ""; position: absolute; left: -7px; top: 50%; margin-top: -8px;
  border: 8px solid transparent; border-right-color: var(--chip); border-left: 0;
}
#kanaApp .lessons { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
#kanaApp .lessons::-webkit-scrollbar { display: none; }
#kanaApp .lessons button {
  flex: 0 0 auto; padding: 7px 14px; border-radius: 999px;
  border: none; background: var(--chip); color: var(--ink); font-size: 14px; cursor: pointer;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
#kanaApp .lessons button[aria-pressed="true"] { background: var(--ai); color: var(--on-ai); }
#kanaApp .learned { display: flex; flex-wrap: wrap; gap: 2px; }
#kanaApp .learned span { width: 28px; height: 28px; display: grid; place-items: center; font-size: 17px; border-radius: 8px; color: var(--ink); opacity: .6; text-shadow: 0 0 8px var(--snow); }
#kanaApp .learned span.new { color: var(--ai); background: var(--chip); font-weight: 600; opacity: 1; text-shadow: none; }
#kanaApp .tabs { display: flex; gap: 4px; background: var(--ice); padding: 4px; border-radius: 14px; margin-bottom: 20px; }
#kanaApp .tabs button {
  flex: 1; background: none; border: none; color: var(--muted);
  padding: 8px 0; font-size: 13px; border-radius: 10px; cursor: pointer;
}
#kanaApp .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; }
#kanaApp .panel[hidden] { display: none; }
#kanaApp .hint { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
#kanaApp .score { color: var(--muted); font-size: 14px; text-align: center; margin-top: 16px; }
#kanaApp .notice { background: var(--berry-soft); color: var(--berry); padding: 10px 12px; border-radius: 12px; font-size: 14px; margin-bottom: 16px; }
#kanaApp .play {
  display: flex; align-items: center; justify-content: center;
  width: 112px; height: 112px; margin: 4px auto 24px; border-radius: 50%;
  border: 6px solid var(--ice); background: var(--ai); color: var(--on-ai); cursor: pointer;
}
#kanaApp .play svg { width: 44px; height: 44px; }
#kanaApp .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#kanaApp .choices button {
  height: 92px; font-size: 48px; border-radius: 18px; cursor: pointer;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  transition: background .15s, border-color .15s;
}
#kanaApp .choices button.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
#kanaApp .choices button.ng { background: var(--ng-soft); border-color: var(--ng); color: var(--ng); }
#kanaApp .feedback { min-height: 26px; text-align: center; margin-top: 12px; font-size: 15px; }
#kanaApp .feedback.ok { color: var(--ok); }
#kanaApp .voice-row { gap: 8px; }
#kanaApp .voice-row[hidden] { display: none; }
#kanaApp .voice-row select {
  flex: 1; min-width: 0; padding: 8px 10px; font-size: 15px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
}
#kanaApp .voice-row .btn { flex: 0 0 auto; padding: 8px 14px; font-size: 15px; }
#kanaApp .compare { margin-top: 10px; color: var(--ink); }
#kanaApp .compare .tip { font-size: 14px; color: var(--muted); margin: 0 0 10px; text-align: left; background: var(--ice); border-radius: 12px; padding: 8px 12px; }
#kanaApp .btn.cmp { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; }
#kanaApp .btn.cmp span { font-size: 34px; line-height: 1.2; }
#kanaApp .btn.cmp small { font-size: 13px; color: var(--muted); }
#kanaApp .feedback.ng { color: var(--ng); }
#kanaApp .card { background: var(--surface); border: 2px solid var(--line); border-radius: 24px; text-align: center; padding: 26px 16px 20px; margin-bottom: 14px; }
#kanaApp .big { font-size: 136px; line-height: 1.1; }
#kanaApp .bigword { font-size: 60px; line-height: 1.3; }
#kanaApp .romaji { min-height: 34px; font-size: 22px; color: var(--ai); letter-spacing: .05em; }
#kanaApp .sub { min-height: 26px; color: var(--muted); font-size: 16px; }
#kanaApp .hide { visibility: hidden; }
#kanaApp .row { display: flex; gap: 10px; margin-bottom: 10px; }
#kanaApp .btn {
  flex: 1; padding: 14px 0; border-radius: 14px; font-size: 16px; cursor: pointer;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
}
#kanaApp .btn.primary { background: var(--ai); border-color: var(--ai); color: var(--on-ai); }
#kanaApp .btn.good { border-color: var(--ok); color: var(--ok); }
#kanaApp .btn.bad { border-color: var(--ng); color: var(--ng); }
#kanaApp .btn.mic.listening { background: var(--berry); border-color: var(--berry); color: #fff; }
#kanaApp .btn[disabled] { opacity: .45; }
#kanaApp .toggle { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 15px; }
#kanaApp .toggle input { width: 20px; height: 20px; accent-color: var(--ai); }
#kanaApp .words { display: flex; flex-direction: column; gap: 8px; }
#kanaApp .group-title { font-size: 14px; color: var(--muted); margin: 18px 0 2px; }
#kanaApp .word {
  display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
  background: var(--surface); border: 2px solid var(--line); border-radius: 16px;
  padding: 12px 14px; color: var(--ink); cursor: pointer; font: inherit;
}
#kanaApp .word .jp { font-size: 28px; min-width: 120px; }
#kanaApp .word .info { flex: 1; }
#kanaApp .word .kanji { color: var(--muted); font-size: 14px; }
#kanaApp .word .mean { font-size: 16px; }
#kanaApp .word .ro { color: var(--ai); font-size: 14px; letter-spacing: .03em; }
#kanaApp .word.covered .mean, #kanaApp .word.covered .kanji { filter: blur(6px); opacity: .5; }
#kanaApp .word svg { width: 22px; height: 22px; color: var(--ai); flex-shrink: 0; }
#kanaApp .m { display: inline-block; position: relative; padding-top: 4px; border-top: 2px solid transparent; }
#kanaApp .m.h { border-top-color: var(--berry); }
#kanaApp .m.d::after { content: ""; position: absolute; right: -1px; top: -2px; height: 40%; border-right: 2px solid var(--berry); }
#kanaApp .legend .m { padding-top: 2px; }
#kanaApp .addform { text-align: left; padding: 18px 16px 16px; }
#kanaApp .addform[hidden] { display: none; }
#kanaApp .addform label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
#kanaApp .addform input {
  display: block; width: 100%; margin-top: 4px; padding: 11px 12px; font-size: 17px;
  border: 2px solid var(--line); border-radius: 12px; background: var(--snow); color: var(--ink);
}
#kanaApp .addform input:focus { outline: none; border-color: var(--ai); }
#kanaApp .addform .feedback { margin: 0 0 10px; min-height: 0; text-align: left; }
#kanaApp .dict-hint { margin: -4px 0 12px; font-size: 14px; color: var(--muted); }
#kanaApp .dict-hint:empty { display: none; }
#kanaApp .cands { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
#kanaApp .cands button {
  border: 2px solid var(--line); background: var(--snow); color: var(--ink);
  border-radius: 12px; padding: 7px 12px; font-size: 15px; cursor: pointer; text-align: left;
}
#kanaApp .cands button b { font-weight: 600; margin-right: 6px; }
#kanaApp .cands button[aria-pressed="true"] { border-color: var(--ai); background: var(--ai-soft); }
#kanaApp .mine { display: flex; gap: 8px; align-items: stretch; }
#kanaApp .mine .word { flex: 1; }
#kanaApp .del { flex: 0 0 48px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--berry); font-size: 20px; cursor: pointer; }
#kanaApp .empty { color: var(--muted); text-align: center; padding: 24px 0; }
#kanaApp .dict-count { font-size: 56px; font-weight: 600; color: var(--ai); line-height: 1.1; }
#kanaApp .dict-count small { font-size: 22px; color: var(--muted); font-weight: 400; }
#kanaApp .dots { display: flex; justify-content: center; gap: 8px; margin: 14px 0; }
#kanaApp .dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
#kanaApp .dots span.done { background: var(--ai); }
#kanaApp .dots span.now { background: var(--berry); }
#kanaApp .dict-status { color: var(--muted); font-size: 15px; min-height: 24px; }
#kanaApp .bar { height: 6px; background: var(--ice); border-radius: 3px; overflow: hidden; margin-top: 12px; }
#kanaApp .bar i { display: block; height: 100%; width: 0; background: var(--ai); }
#kanaApp .ans-no { width: 28px; height: 28px; border-radius: 50%; background: var(--ai-soft); color: var(--ai); display: grid; place-items: center; font-size: 14px; font-weight: 600; flex-shrink: 0; }
@media (prefers-reduced-motion: reduce) {
#kanaApp, #kanaApp * { transition: none !important; animation: none !important; }
}
#kanaApp .home-btn {
  border: none; background: var(--chip); color: var(--ink); font-size: 14px;
  padding: 6px 12px; border-radius: 999px; cursor: pointer; margin-bottom: 8px;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
</style>
</head>

<script>
/* ===== 課程一：日文聲音練習簿 ===== */
(() => {

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const view = $('#view');
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const uniqArr = arrs => { const s=new Set(); return arrs.filter(a=>{const k=a.join('');if(s.has(k))return false;s.add(k);return true;}); };

/* ---------- kana ---------- */
const toKata = s => s.replace(/[\u3041-\u3096]/g, c=>String.fromCharCode(c.charCodeAt(0)+0x60));
const toHira = s => s.replace(/[\u30A1-\u30F6]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const SMALL='ゃゅょぁぃぅぇぉャュョァィゥェォ';
function splitMoras(str){ const out=[]; for(const ch of str){ if(SMALL.includes(ch)&&out.length&&out[out.length-1]!==' ') out[out.length-1]+=ch; else out.push(ch);} return out; }
const R={あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',を:'o',ん:'n',が:'ga',ぎ:'gi',ぐ:'gu',げ:'ge',ご:'go',ざ:'za',じ:'ji',ず:'zu',ぜ:'ze',ぞ:'zo',だ:'da',ぢ:'ji',づ:'zu',で:'de',ど:'do',ば:'ba',び:'bi',ぶ:'bu',べ:'be',ぼ:'bo',ぱ:'pa',ぴ:'pi',ぷ:'pu',ぺ:'pe',ぽ:'po'};
function romaMora(m){
  const h=toHira(m);
  if(h==='っ'||m==='ー') return '';
  if(R[h]) return R[h];
  if(h.length===2){ const b=R[h[0]], v={'ゃ':'a','ゅ':'u','ょ':'o'}[h[1]]; if(!b||!v) return '';
    return /^(sh|ch|j)/.test(b) ? b.slice(0,-1)+v : b.slice(0,-1)+'y'+v; }
  return '';
}
function wordRoma(ms){
  let out='', dbl=false;
  for(const m of ms){
    if(m===' '){out+=' ';continue;}
    if(toHira(m)==='っ'){dbl=true;continue;}
    if(m==='ー'){const v=out.match(/[aeiou]$/); out+=v?v[0]:''; continue;}
    let r=romaMora(m);
    if(dbl&&r){ r=r.startsWith('ch')?'t'+r:r[0]+r; dbl=false; }
    out+=r;
  }
  return out;
}

};
const ROWS_ALL=Object.values(GROUPS).flatMap(g=>g.rows);
const EXCL=['を','ぢ','づ'];

const TIPS={
  'う':'嘴唇不要嘟圓，比中文「烏」扁一點，放鬆地發音。',
  'え':'比中文「ㄝ」嘴巴再張開一點點。',
  'お':'嘴唇微圓，比中文「喔」短而乾淨。',
  'し':'介於「西」和「師」之間，舌頭不捲。',
  'す':'結尾的 u 很輕，常常幾乎聽不到，聽起來像「ㄙ」。',
  'ち':'像「七」，但氣不要送太強。',
  'つ':'舌尖先頂住上排牙齒後面再放開，像「ㄘ」接一個扁扁的 u。不是「ㄘㄨ」，也不是「七」。',
  'ひ':'舌面靠近上顎，像很輕的「ㄒ」，比「ㄏ」的位置更前面。',

/* Speak while lighting up mora cells one by one.
   Browsers don't report per-mora position, so timing is estimated
   and re-calibrated after every playback from the real duration. */
/* Total playback time = silence before/after speech + (moras × time per mora).
   The old version divided the whole time (silence included) by the mora count,
   which made each step too long. Now we fit a line over recent playbacks of
   different lengths, so the fixed silence goes into the intercept and only
   the slope is used as the per-mora step. */
const hlSamples=[];
let hlAdj=1;   // manual factor from the user: >1 = cells move faster
function msPerMora(){
  const n=hlSamples.length;
  if(n>=3){
    const mx=hlSamples.reduce((a,s)=>a+s.n,0)/n, my=hlSamples.reduce((a,s)=>a+s.y,0)/n;
    let num=0, den=0;
    hlSamples.forEach(s=>{ num+=(s.n-mx)*(s.y-my); den+=(s.n-mx)**2; });
    if(den>0){ const slope=num/den; if(slope>60&&slope<220) return slope; }
  }
  return 100;  // typical Japanese TTS at normal speed: roughly 9–10 moras per second
}
function speakHL(text,r,root=view){
  const cells=[...root.querySelectorAll('.mc')];
  r=r||rate();
  return new Promise(res=>{
    if(!hasTTS||!cells.length){ speak(text,r).then(res); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP'; if(jaVoice) u.voice=jaVoice; u.rate=r;
    let t0=0, timer=null, started=false, fallback=null;
    const clear=()=>cells.forEach(c=>c.classList.remove('beat'));
    const run=()=>{
      if(started) return; started=true; clearTimeout(fallback);
      t0=performance.now(); const step=msPerMora()/r/hlAdj; let i=0;
      const next=()=>{
        if(i>=cells.length) return;            // keep last cell lit until speech ends
        clear(); cells[i].classList.add('beat'); i++;
        timer=setTimeout(next,step);
      };
      next();
    };
    const finish=calibrate=>{
      clearTimeout(timer); clearTimeout(fallback);
      if(calibrate&&t0){
        const y=(performance.now()-t0)*r;          // normalise to rate 1
        if(y>100&&y<6000){ hlSamples.push({n:cells.length,y}); if(hlSamples.length>15) hlSamples.shift(); }
      }
      setTimeout(clear,150); res();
    };
    u.onstart=run;
    u.onend=()=>finish(true);
    u.onerror=()=>finish(false);
    fallback=setTimeout(run,400);              // some browsers never fire onstart
    speechSynthesis.speak(u);
  });
}
async function speakSeq(arr,gap=450){ for(const t of arr){ await speak(t); await new Promise(r=>setTimeout(r,gap)); } }
let actx=null;
function tick(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value=880; g.gain.setValueAtTime(.25,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.08);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.09);
  }catch(e){}
}

let moQ=[], moI=0, moDone=false, moPick=null;
function mora(){ moQ=shuffle(WORDS); moI=0; newMora(); }
function newMora(){ if(moI>=moQ.length){moQ=shuffle(WORDS);moI=0;} moDone=false; moPick=null; renderMora(); speak(moQ[moI].s); }
function renderMora(){
  const w=moQ[moI], ms=splitMoras(w.k), n=ms.length, ok=moPick===n;
  const hasSp=ms.some((m,i)=>isSpecial(w,i,m));
  view.innerHTML=`<div class="card">
    <p class="prompt">這個詞的意思是「${w.zh}」。聽聽看，它有幾拍？</p>
    <div class="row"><button class="btn pri" data-act="play">▶ 再聽一次</button><button class="btn" data-act="slow">慢速</button></div>
    <div class="choices nums">${[1,2,3,4,5,6].map(x=>`<button class="ch ${moDone?(x===n?'right':(x===moPick?'wrong':'')):''}" data-act="ans" data-n="${x}" ${moDone?'disabled':''}>${x}</button>`).join('')}</div>
    ${moDone?`<div class="res">${stamp(ok)}<p>${ok?'答對了！':`正確答案是 ${n} 拍。`}「${w.k}」唸作 ${wordRoma(ms)}。</p></div>
      ${cellsHTML(ms,{word:w})}
      ${hasSp?'<p class="muted small">灰底的格子是特殊拍：促音「っ」停一拍、長音拉長一拍、撥音「ん」鼻音一拍。它們都要算進去。</p>':''}
      <p class="muted small">按「再聽一次」或「慢速」時，格子會跟著語音亮起來；點格子可以單獨聽每一拍。</p>
      <div class="row" style="align-items:center"><span class="muted small">格子跟不上或跑太快？</span><button class="btn" data-act="hlslow">格子慢一點</button><button class="btn" data-act="hlfast">格子快一點</button><span class="muted small" id="hlv">${Math.round(hlAdj*100)}%</span></div>
      <div class="row"><button class="btn" data-act="beat">跟著格子拍手</button><button class="btn pri" data-act="next">下一題</button></div>`:''}
  </div>
  <p class="muted small">小技巧：日語每一拍的長度差不多，像節拍器一樣平均。數拍時可以邊聽邊拍手。</p>`;
  handler=(a,el)=>{
    if(a==='play') moDone?speakHL(w.s):speak(w.s);
    if(a==='slow') moDone?speakHL(w.s,0.5):speak(w.s,0.5);
    if(a==='ans'){ moPick=+el.dataset.n; moDone=true; record('mora',moPick===n); renderMora(); speakHL(w.s); }
    if(a==='next'){ moI++; newMora(); }
    if(a==='hlfast'||a==='hlslow'){
      hlAdj=Math.min(2,Math.max(0.5,+(hlAdj+(a==='hlfast'?0.1:-0.1)).toFixed(2)));
      stats.hlAdj=hlAdj; saveStats(); $('#hlv').textContent=Math.round(hlAdj*100)+'%';
      speakHL(w.s);
    }
    if(a==='beat') beat(w);
  };
}
function beat(w){
  const cells=[...view.querySelectorAll('.mc')]; let i=0;
  const iv=setInterval(()=>{
    cells.forEach(c=>c.classList.remove('beat'));
    if(i<cells.length){ cells[i].classList.add('beat'); tick(); i++; }
    else { clearInterval(iv); speak(w.s); }
  },600);
}

/* ---------- 3. pairs ---------- */
let paCat='全部', paQ=null, paDone=false, paPick=null;
function pairs(){ newPair(); }
function newPair(){
  const pool=PAIRS.filter(p=>paCat==='全部'||p.c===paCat);
  let p=pick(pool); if(paQ&&pool.length>1) while(p===paQ.p) p=pick(pool);
  paQ={p,t:Math.random()<.5?'a':'b'}; paDone=false; paPick=null; renderPairs(); speak(p[paQ.t].s||p[paQ.t].k);
}
function optCard(o,x){
  const {t}=paQ; const cls=paDone?(x===t?'right':(x===paPick?'wrong':'')):'';
  const body=o.p
    ?`<span class="kanji jp">${o.s}</span><span class="pw">${cellsHTML(splitMoras(o.k),{static:true,roma:false,size:38,pitch:o.p})}</span>`
    :`<span class="jp kana">${o.k}</span>${o.s&&o.s!==o.k?`<span class="kanji jp">${o.s}</span>`:''}`;
  return `<div class="opt ${cls}"><button class="opt-main" data-act="ans" data-x="${x}" ${paDone?'disabled':''}>${body}<small>${wordRoma(splitMoras(o.k))}</small><span>${o.zh}</span></button><button class="mini" data-act="hear" data-x="${x}">聽這個</button></div>`;
}
function renderPairs(){
  const {p,t}=paQ, ok=paPick===t;
  view.innerHTML=`<div class="chips">${CATS.map(c=>`<button class="chip ${c===paCat?'on':''}" data-act="cat" data-c="${c}">${c}</button>`).join('')}</div>
  <div class="card">
    <p class="prompt">聽到的是哪一個？</p>
    <div class="row"><button class="btn pri" data-act="play">▶ 再聽一次</button><button class="btn" data-act="slow">慢速</button></div>
    <div class="pair">${optCard(p.a,'a')}${optCard(p.b,'b')}</div>
    ${paDone?`<div class="res">${stamp(ok)}<p>${ok?'答對了！':`剛才唸的是「${p[t].s||p[t].k}」（${p[t].zh}）。`}</p></div>
      <div class="row"><button class="btn pri" data-act="next">下一題</button></div>`:''}
  </div>
  <p class="muted small">${CAT_NOTE[p.c]}可以先按「聽這個」比較兩個詞，再作答。</p>`;
  handler=(a,el)=>{
    const say=o=>o.s||o.k;
    if(a==='cat'){ paCat=el.dataset.c; newPair(); }
    if(a==='play') speak(say(p[t]));
    if(a==='slow') speak(say(p[t]),0.5);
    if(a==='hear') speak(say(p[el.dataset.x]));
    if(a==='ans'){ paPick=el.dataset.x; paDone=true; record('pairs',paPick===t); renderPairs(); }
    if(a==='next') newPair();
  };
}

/* ---------- 4. play (manipulation) ---------- */
const BASIC=['か','さ','た','な','は','ま','や','ら','き','し','と','の','も','す','に','こ'];
let plQ=null, plDone=false, plPick=null;
function play(){ newPlay(); }
function newPlay(){
  const ty=pick(['blend','seg','del','sub']); let q;
  if(ty==='blend'){
    const pool=WORDS.filter(w=>!/[っッー]/.test(w.k)); const w=pick(pool);
    const opts=shuffle([w,...shuffle(pool.filter(x=>x!==w)).slice(0,2)]);
    q={label:'合起來',prompt:'我會一個一個唸出聲音。把它們合起來，是哪一個詞？',
      play:()=>speakSeq(splitMoras(w.k).map(toKata)),opts:opts.map(o=>splitMoras(o.k)),ans:opts.indexOf(w),
      sayAns:w.s,ansMs:splitMoras(w.k),note:`合起來是「${w.k}」，意思是「${w.zh}」。`};
  }
  if(ty==='seg'){
    const w=pick(WORDS), ms=splitMoras(w.k);
    const n=pick(ms.map((_,i)=>i).filter(i=>!isSpecial(w,i,ms[i]))); const c=toHira(ms[n]);
    const pool=[...new Set([...BASIC,...WORDS.flatMap(x=>splitMoras(toHira(x.k)))])].filter(k=>k!==c&&!/[っーん]/.test(k));
    const opts=shuffle([c,...shuffle(pool).slice(0,3)]);
    q={label:'拆開',prompt:`聽「${w.zh}」。第 ${n+1} 拍是哪個音？`,play:()=>speak(w.s),
      opts:opts.map(o=>[o]),ans:opts.indexOf(c),sayAns:toKata(c),ansMs:ms,ansWord:w,
      note:`「${w.k}」一共 ${ms.length} 拍，第 ${n+1} 拍是「${ms[n]}」。`};
  }
  if(ty==='del'){
    const pool=WORDS.filter(w=>{const ms=splitMoras(w.k);return ms.length>=3&&!isSpecial(w,0,ms[0])&&!isSpecial(w,1,ms[1]);});
    const w=pick(pool), ms=splitMoras(w.k), c=ms.slice(1);
    const opts=shuffle(uniqArr([c,ms.slice(0,-1),ms.filter((_,i)=>i!==1),ms]));
    q={label:'拿掉',prompt:`聽「${w.zh}」。拿掉第一拍「${ms[0]}」之後，剩下什麼？`,play:()=>speak(w.s),
      opts,ans:opts.findIndex(o=>o.join('')===c.join('')),sayAns:toKata(c.join('')),ansMs:c,
      note:`「${w.k}」拿掉「${ms[0]}」，剩下「${c.join('')}」。`};
  }
  if(ty==='sub'){
    const pool=WORDS.filter(w=>{const ms=splitMoras(w.k);return !/[ァ-ヶー]/.test(w.k)&&!isSpecial(w,0,ms[0]);});
    const w=pick(pool), ms=splitMoras(w.k);
    const nk=pick(BASIC.filter(k=>k!==ms[0]&&k!==ms[ms.length-1])), nk2=pick(BASIC.filter(k=>k!==ms[0]&&k!==nk));
    const c=[nk,...ms.slice(1)];
    const opts=shuffle(uniqArr([c,[...ms.slice(0,-1),nk],ms,[nk2,...ms.slice(1)]]));
    q={label:'替換',prompt:`把「${w.k}」（${w.zh}）的第一拍換成「${nk}」，會變成什麼？`,
      play:()=>speakSeq([w.s,toKata(nk)],500),opts,ans:opts.findIndex(o=>o.join('')===c.join('')),
      sayAns:toKata(c.join('')),ansMs:c,note:`第一拍「${ms[0]}」換成「${nk}」，變成「${c.join('')}」。`};
  }
  plQ=q; plDone=false; plPick=null; renderPlay();
}
function renderPlay(){
  const q=plQ, single=q.opts[0].length===1;
  view.innerHTML=`<div class="card">
    <p class="kind">${q.label}</p>
    <p class="prompt">${q.prompt}</p>
    <div class="row"><button class="btn pri" data-act="play">▶ 聽題目</button></div>
    <div class="choices ${single?'grid4':'list'}">${q.opts.map((o,i)=>`<button class="ch ${plDone?(i===q.ans?'right':(i===plPick?'wrong':'')):''}" data-act="ans" data-i="${i}" ${plDone?'disabled':''}><span class="jp">${o.join('')}</span><small>${wordRoma(o)}</small></button>`).join('')}</div>
    ${plDone?`<div class="res">${stamp(plPick===q.ans)}<p>${q.note}</p></div>
      ${cellsHTML(q.ansMs,{word:q.ansWord})}
      <div class="row"><button class="btn" data-act="hear">聽答案</button><button class="btn pri" data-act="next">下一題</button></div>`:''}
  </div>
  <p class="muted small">四種練習會隨機出現：合起來、拆開、拿掉、替換。替換後的結果不一定是真的單字，重點是練習操作聲音。</p>`;
  handler=(a,el)=>{
    if(a==='play') q.play();
    if(a==='ans'){ plPick=+el.dataset.i; plDone=true; record('play',plPick===q.ans); renderPlay(); speak(q.sayAns); }
    if(a==='hear') speak(q.sayAns);
    if(a==='next') newPlay();
  };
}

/* ---------- 5. kana quiz ---------- */
let kqRows=new Set(['a','ka','sa']), kqRoma=true, kqQ=null, kqDone=false, kqPick=null, kqStreak=0;
function kanaQuiz(){ newKq(); }
function kqPool(){ return ROWS_ALL.filter(r=>kqRows.has(r.id)).flatMap(r=>r.k).filter(k=>k&&!EXCL.includes(k)); }
function newKq(){
  const pool=kqPool(), t=pick(pool);
  let d=shuffle(pool.filter(k=>k!==t)).slice(0,3);
  if(d.length<3){ const extra=shuffle(GROUPS.seion.rows.flatMap(r=>r.k).filter(k=>k&&!EXCL.includes(k)&&k!==t&&!d.includes(k))); d=d.concat(extra.slice(0,3-d.length)); }
  kqQ={t,opts:shuffle([t,...d])}; kqDone=false; kqPick=null; renderKana(); speak(toKata(t));
}
function renderKana(){
  const q=kqQ, ok=kqPick===q.t;
  view.innerHTML=`<p class="hint">選要練習的行（可以多選）：</p>
  <div class="chips">${ROWS_ALL.map(r=>`<button class="chip jp ${kqRows.has(r.id)?'on':''}" data-act="row" data-id="${r.id}">${r.n}</button>`).join('')}</div>
  <label class="switch"><input type="checkbox" data-act="roma" ${kqRoma?'checked':''}> 選項顯示羅馬拼音（剛開始建議打開）</label>
  <div class="card">
    <p class="prompt">聽到的是哪一個假名？</p>
    <div class="row"><button class="btn pri" data-act="play">▶ 再聽一次</button><button class="btn" data-act="slow">慢速</button></div>
    <div class="choices grid4">${q.opts.map(k=>`<button class="ch ${kqDone?(k===q.t?'right':(k===kqPick?'wrong':'')):''}" data-act="ans" data-k="${k}" ${kqDone?'disabled':''}><span class="jp">${k}</span>${kqRoma||kqDone?`<small>${romaMora(k)}</small>`:''}</button>`).join('')}</div>
    ${kqDone?`<div class="res">${stamp(ok)}<p>${ok?`答對了，連續答對 ${kqStreak} 題。`:`答案是「${q.t}」（${romaMora(q.t)}）。`}</p></div>
      <div class="row"><button class="btn pri" data-act="next">下一題</button></div>`:''}
  </div>`;
  handler=(a,el)=>{
    if(a==='row'){ const id=el.dataset.id; if(kqRows.has(id)){ if(kqRows.size>1) kqRows.delete(id); } else kqRows.add(id); newKq(); }
    if(a==='roma'){ kqRoma=el.checked; renderKana(); }
    if(a==='play') speak(toKata(q.t));
    if(a==='slow') speak(toKata(q.t),0.5);
    if(a==='ans'){ kqPick=el.dataset.k; kqDone=true; const r=kqPick===q.t; kqStreak=r?kqStreak+1:0; record('kana',r); renderKana(); speak(toKata(q.t)); }
    if(a==='next') newKq();
  };
}

/* ---------- 6. shadow ---------- */
let shSel=0, recorder=null, recURL=null, recState='idle', micErr='';
function shadow(){ renderShadow(); }
function renderShadow(){
  const p=PHRASES[shSel], ms=splitMoras(p.k), count=ms.filter(m=>m!==' ').length, say=p.s||p.k.replace(/ /g,'');
  view.innerHTML=`<div class="chips">${PHRASES.map((x,i)=>`<button class="chip ${i===shSel?'on':''}" data-act="sel" data-i="${i}">${x.zh}</button>`).join('')}</div>
  <div class="card">
    ${cellsHTML(ms,{roma:false,static:true,size:42})}
    <p class="roma">${p.r}</p>
    <p style="margin:2px 0 6px">${p.zh}，共 ${count} 拍</p>
    <p class="muted small">${p.note}</p>
    <div class="row"><button class="btn pri" data-act="play">▶ 原音</button><button class="btn" data-act="slow">慢速</button></div>
    <div class="row">
      <button class="btn ${recState==='rec'?'rec':''}" data-act="rec">${recState==='rec'?'■ 停止錄音':'● 開始錄音'}</button>
      <button class="btn" data-act="mine" ${recURL?'':'disabled'}>播放我的錄音</button>
      <button class="btn" data-act="both" ${recURL?'':'disabled'}>原音接著我的</button>
    </div>
    ${micErr?`<p class="err">${micErr}</p>`:''}
    <details class="steps"><summary>跟讀的步驟</summary><ol>
      <li>先聽原音兩三次，不看文字也能跟著哼出節奏。</li>
      <li>用慢速跟著唸，注意每一拍的長度都差不多。</li>
      <li>錄下自己，再按「原音接著我的」比較拍數、清濁、長音和高低。</li>
    </ol></details>
  </div>`;
  handler=(a,el)=>{
    if(a==='sel'){ shSel=+el.dataset.i; recURL=null; micErr=''; renderShadow(); }
    if(a==='play') speakHL(say);
    if(a==='slow') speakHL(say,0.5);
    if(a==='rec') recState==='rec'?recorder.stop():startRec();
    if(a==='mine'&&recURL) new Audio(recURL).play();
    if(a==='both'&&recURL) speakHL(say).then(()=>setTimeout(()=>new Audio(recURL).play(),400));
  };
}
async function startRec(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[]; recorder=new MediaRecorder(stream);
    recorder.ondataavailable=e=>chunks.push(e.data);
    recorder.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      if(recURL) URL.revokeObjectURL(recURL);
      recURL=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));
      recState='idle'; if(current==='shadow') renderShadow();
    };
    recorder.start(); recState='rec'; micErr=''; renderShadow();
  }catch(err){
    micErr='無法使用麥克風。請允許麥克風權限；如果在這裡還是不能錄音，可以下載這個 HTML 檔，用手機或電腦的瀏覽器開啟。';
    recState='idle'; renderShadow();
  }
}

/* ---------- start ---------- */
loadStats().then(()=>{ if(typeof stats.hlAdj==='number') hlAdj=stats.hlAdj; go('home'); });
window.SND_APP={
  enter(){ if(current==='home') home(); },
  leave(){ if(hasTTS) speechSynthesis.cancel(); if(recState==='rec'&&recorder) recorder.stop(); },
};

})();
</script>

function pitchHTML(w) {
  const m = [...w], n = ACCENT[w];
  if (n === undefined) return w;
  return m.map((c, i) => {
    const high = n === 0 ? i > 0 || m.length === 1 : (n === 1 ? i === 0 : i > 0 && i < n);
    const drop = n > 0 && i === n - 1;
    return `<span class="m${high ? " h" : ""}${drop ? " d" : ""}">${c}</span>`;
  }).join("");
}

function kanaUtter(k, rate = 0.6) {
  // 單獨一個平假名改用片假名朗讀，避免へ、は被當成助詞念成「え」「わ」

function warmUp() {

function speakKana(k) {
  if (!("speechSynthesis" in window)) return;
  clearTimeout(kanaTimer);
  speechSynthesis.cancel();
  kanaTimer = setTimeout(() => {
    let done = false;
    const second = () => {
      if (done) return;
      done = true;
      clearTimeout(kanaTimer);
      kanaTimer = setTimeout(() => speechSynthesis.speak(kanaUtter(k)), 1000);
    };
    const first = kanaUtter(k);
    first.onend = second;
    warmUp();
    speechSynthesis.speak(first);
    kanaTimer = setTimeout(second, 3000);   // 備援：沒收到 onend 時，2 秒後照樣念第二次
  }, 120);
}

// 本課 60%、之前各課合計 40%（第一課則全部是本課）
function pickWeighted(current, previous, last) {
  let first = current, second = previous;
  if (previous.length && Math.random() >= 0.6) [first, second] = [previous, current];
  const a = first.filter(x => x !== last);
  if (a.length) return a[Math.floor(Math.random() * a.length)];
  const b = second.filter(x => x !== last);
  return b.length ? b[Math.floor(Math.random() * b.length)] : first[0];
}

  let k; do { k = pool[Math.floor(Math.random() * pool.length)]; } while (k === last);

}

const mkRow = () => { const r = document.createElement("div"); r.className = "row"; readActions.appendChild(r); return r; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const setFb = (text, cls = "") => { readFb.textContent = text; readFb.className = "feedback " + cls; };

function dropTake() {
  if (take && take.url) URL.revokeObjectURL(take.url);
  take = null;
}
function newRead() {
  if (session) { session.cancelled = true; session.stop(); }
  if (myAudio) myAudio.pause();
  dropTake();
  revealed = false;
  readKana = pickKana(readKana);
  document.getElementById("readKana").textContent = readKana;
  romajiEl.textContent = ROMAJI[readKana];
  romajiEl.classList.add("hide");
  setFb("");
  renderReadButtons();
  updateReadScore();
}

function renderReadButtons(manual = false) {
  readActions.innerHTML = "";
  if (!revealed) {
    if (CAN_RECORD) {
      const r1 = mkRow();
      const recBtn = mkBtn(r1, session ? "錄音中…（點一下停止）" : (take ? "重錄" : "我來念"), "mic" + (session ? " listening" : ""), onRecBtn);
      const playBtn = mkBtn(r1, "播放我的錄音", "", playMine);
      playBtn.disabled = !take || !!session;
    }
    mkBtn(mkRow(), "看答案", "primary", revealRead);
  } else {
    const r1 = mkRow();
    mkBtn(r1, "正確發音", "", () => speakKana(readKana));
    if (take) mkBtn(r1, "我的錄音", "", playMine);
    const r2 = mkRow();
    if (manual) {
      mkBtn(r2, "念錯了", "bad", () => { readStats.total++; newRead(); });
      mkBtn(r2, "念對了", "good", () => { readStats.ok++; readStats.total++; newRead(); });
    } else {
      mkBtn(r2, "下一個", "primary", newRead);
    }
  }
}

function playMine() {
  if (!take) return;
  speechSynthesis.cancel();
  if (myAudio) myAudio.pause();
  myAudio = new Audio(take.url);
  myAudio.play().catch(() => setFb("無法播放錄音", "ng"));
}

function onRecBtn() {
  if (session) { session.stop(); return; }   // 錄音中再按一次 = 手動停止
  startRecording();
}

async function startRecording() {
  speechSynthesis.cancel();
  if (myAudio) myAudio.pause();
  // iPhone 規定音訊功能要在點擊當下啟動，所以先建立
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();

  const s = { chunks: [], heard: [], voiced: false, stopped: false, cancelled: false, recogActive: false };
  session = s;
  s.stop = () => {
    if (s.stopped) return;
    s.stopped = true;
    try { s.src && s.src.disconnect(); } catch (e) {}
    try { s.recog && s.recog.stop(); } catch (e) {}
    if (s.mr && s.mr.state !== "inactive") s.mr.stop();
    else finish();
  };
  setFb("請念…（念完會自動停止）");
  renderReadButtons();

  // 同時啟動語音辨識，用來評分
  if (Recog) {
    try {
      const r = new Recog();
      r.lang = "ja-JP"; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
      r.onresult = ev => { for (const res of ev.results) for (const alt of res) s.heard.push(alt.transcript.trim()); };
      r.onerror = () => {};
      r.onend = () => { s.recogActive = false; };
      r.start();
      s.recog = r; s.recogActive = true;
    } catch (e) {}
  }

  try {
    s.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    session = null;
    try { s.recog && s.recog.abort(); } catch (e2) {}
    setFb(IS_ANDROID ? "沒有麥克風權限。請點網址列左邊的圖示 → 權限 → 允許麥克風。"
                     : "沒有麥克風權限。請在 Safari 允許使用麥克風（網址列「ぁあ」→ 網站設定）。", "ng");
    renderReadButtons();
    return;
  }
  if (s.cancelled || s.stopped) { s.stream.getTracks().forEach(t => t.stop()); return; }

  // 錄音
  s.mr = new MediaRecorder(s.stream);
  s.mr.ondataavailable = e => { if (e.data && e.data.size) s.chunks.push(e.data); };
  s.mr.onstop = finish;
  s.mr.start();

  // 偵測聲音：先量環境噪音，聽到聲音後安靜 0.9 秒就自動停止
  s.src = audioCtx.createMediaStreamSource(s.stream);
  const an = audioCtx.createAnalyser();
  an.fftSize = 1024;
  s.src.connect(an);
  const buf = new Float32Array(an.fftSize);
  const t0 = performance.now();
  let floor = 0, floorN = 0, lastVoice = 0, voiceMs = 0, lastT = t0;
  (function tick() {
    if (s.stopped) return;
    an.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    const now = performance.now();
    if (now - t0 < 250) { floor += rms; floorN++; }
    else {
      const th = Math.max(0.015, (floor / Math.max(floorN, 1)) * 3);
      if (rms > th) { voiceMs += now - lastT; lastVoice = now; if (voiceMs > 80) s.voiced = true; }
      if (s.voiced && now - lastVoice > 900) return s.stop();
      if (!s.voiced && now - t0 > 6000) return s.stop();
      if (now - t0 > 8000) return s.stop();
    }
    lastT = now;
    requestAnimationFrame(tick);
  })();

  function finish() {
    if (s.stream) s.stream.getTracks().forEach(t => t.stop());   // 關掉麥克風
    if (session === s) session = null;
    if (s.cancelled) return;
    if (s.voiced || s.heard.length) {
      dropTake();   // 新錄音蓋掉舊的
      take = {
        url: URL.createObjectURL(new Blob(s.chunks, { type: (s.mr && s.mr.mimeType) || "audio/mp4" })),
        get heard() { return s.heard; },
        get recogActive() { return s.recogActive; },
      };
      setFb("錄好了！可以播放、重錄，或按「看答案」");
    } else {
      setFb(take ? "沒聽到聲音，保留上一次的錄音" : "沒聽到聲音，再按一次試試", "ng");
    }
    renderReadButtons();
  }
}

async function revealRead() {
  // 還在錄音就先停止
  if (session) {
    session.stop();
    for (let i = 0; i < 20 && session; i++) await sleep(100);
  }
  // 等語音辨識結果（最多 2 秒）
  for (let i = 0; i < 20 && take && take.recogActive && !take.heard.length; i++) await sleep(100);

  revealed = true;
  romajiEl.classList.remove("hide");
  speakKana(readKana);

  if (take && take.heard.length) {
    const ok = take.heard.some(h => heardMatches(h, readKana));
    readStats.total++;
    if (ok) readStats.ok++;
    setFb(ok ? `正確！念得很好 ✓` : `不正確 ✗　聽起來像「${take.heard[0]}」`, ok ? "ok" : "ng");
    say(ok ? pickOne(PRAISE) : "比較一下兩個錄音，再試一次", ok ? "happy" : "oops");
    renderReadButtons(false);
  } else if (take) {
    setFb("這支手機沒辦法同時錄音和辨識，請播放你的錄音和正確發音比較後自評");
    renderReadButtons(true);
  } else {
    setFb("沒有錄音，請自評");
    renderReadButtons(true);
  }
  updateReadScore();
}
function updateReadScore() {
  document.getElementById("readScore").textContent = readStats.total ? `念對 ${readStats.ok} / ${readStats.total} 個` : "";
}

// ===== 單字卡片 =====
let covered = false;
document.querySelectorAll(".coverToggle").forEach(t => t.onchange = () => {
  covered = t.checked;
  document.querySelectorAll(".coverToggle").forEach(x => x.checked = covered);
  renderWords(); renderBank(); renderMine();
});
function wordCard(item) {
  const [w, kanji, mean] = item;
  const b = document.createElement("button");
  b.className = "word" + (covered ? " covered" : "");
  b.innerHTML = `<span class="jp kana-font" lang="ja">${pitchHTML(w)}</span>
    <span class="info"><div class="kanji" lang="ja">${kanji}</div><div class="mean">${mean}</div></span>${speakerSvg}`;
  b.onclick = () => { b.classList.remove("covered"); speakWord(item); };
  return b;
}
function renderWords() {
  const el = document.getElementById("wordList");
  el.innerHTML = "";
  const list = WORD_LESSON[lesson];
  if (!list.length) { el.innerHTML = '<div class="empty">這一課沒有新單字</div>'; return; }
  list.forEach(item => el.appendChild(wordCard(item)));
}
function renderBank() {
  const el = document.getElementById("bankWords");
  el.innerHTML = "";
  for (let i = 0; i <= lesson; i++) {
    if (!WORD_LESSON[i].length) continue;
    const h = document.createElement("div");
    h.className = "group-title";
    h.textContent = `第${i + 1}課（${LESSONS[i].join("")}）`;
    el.appendChild(h);
    WORD_LESSON[i].forEach(item => el.appendChild(wordCard(item)));
  }
}

// ===== 我的單字（存在這支手機的瀏覽器裡）=====
const MY_KEY = "kana-app-my-words";
let myWords = [];
try { myWords = JSON.parse(localStorage.getItem(MY_KEY) || "[]"); } catch (e) { myWords = []; }
function saveMyWords() {
  try { localStorage.setItem(MY_KEY, JSON.stringify(myWords)); return true; } catch (e) { return false; }
}
const myItems = () => myWords.map(o => { const a = [o.w, o.k || "", o.m]; a.custom = true; return a; });

function renderMine() {
  const el = document.getElementById("myWords");
  el.innerHTML = "";
  if (!myWords.length) { el.innerHTML = '<div class="hint" style="margin:4px 0 0">還沒有自己的單字。看到新單字時，按下面的按鈕加進來。</div>'; return; }
  myItems().forEach((item, i) => {
    const wrap = document.createElement("div");
    wrap.className = "mine";
    wrap.appendChild(wordCard(item));
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.setAttribute("aria-label", `刪除 ${item[0]}`);
    del.onclick = () => {
      if (!confirm(`要刪除「${item[0]}」嗎？`)) return;
      myWords.splice(i, 1); saveMyWords(); renderMine();
    };
    wrap.appendChild(del);
    el.appendChild(wrap);
  });
}

};
document.getElementById("addCancel").onclick = () => { addForm.hidden = true; };

  // 只覆蓋空白或之前自動填入的欄位，不會蓋掉你自己打的字
  if (!inKanji.value || inKanji.dataset.auto) { inKanji.value = e.k; inKanji.dataset.auto = "1"; }
  if (!inMean.value || inMean.dataset.auto) { inMean.value = e.m; inMean.dataset.auto = "1"; }
}
function clearAuto() {
  [inKanji, inMean].forEach(el => { if (el.dataset.auto) { el.value = ""; delete el.dataset.auto; } });
}
[inKanji, inMean].forEach(el => el.addEventListener("input", () => delete el.dataset.auto));
function lookupKana() {
  const key = toHira(inKana.value.trim().replace(/\s+/g, ""));
  dictHint.innerHTML = "";
  clearAuto();
  if (!key) return;
  const found = DICT.get(key);
  if (!found) {
    if (key.length >= 2) dictHint.textContent = "辭典裡找不到這個字，請自己填寫漢字和意思。";
    return;
  }
  if (found.length === 1) {
    fillFrom(found[0]);
    dictHint.textContent = "已從辭典自動填入，可以再修改。";
    return;
  }
  dictHint.textContent = `這個讀音有 ${found.length} 個意思，請選一個：`;
  const box = document.createElement("div");
  box.className = "cands";
  found.forEach(e => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<b lang="ja">${e.k || e.w}</b>${e.m}`;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => {
      box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
      clearAuto();
      fillFrom(e);
    };
    box.appendChild(b);
  });
  dictHint.appendChild(box);
}
inKana.addEventListener("input", () => { clearTimeout(lookupTimer); lookupTimer = setTimeout(lookupKana, 300); });
document.getElementById("addSave").onclick = () => {
  const w = document.getElementById("inKana").value.trim().replace(/\s+/g, "");
  const k = document.getElementById("inKanji").value.trim();
  const m = document.getElementById("inMean").value.trim();
  if (!w) return addMsg.textContent = "請輸入假名";
  if (!/^[\u3041-\u3096\u30A1-\u30FAー]+$/.test(w)) return addMsg.textContent = "假名欄只能輸入平假名或片假名";
  if (!m) return addMsg.textContent = "請輸入中文意思";
  if (myWords.some(o => o.w === w && (o.k || "") === k)) return addMsg.textContent = "這個單字已經加過了";
  myWords.push({ w, k, m });
  const saved = saveMyWords();
  ["inKana", "inKanji", "inMean"].forEach(id => { const el = document.getElementById(id); el.value = ""; delete el.dataset.auto; });
  dictHint.innerHTML = "";
  addForm.hidden = true;
  renderMine();
  say(saved ? `記住「${w}」了！` : "已加入，但這個瀏覽器無法保存，關掉後會消失", saved ? "happy" : "oops");
  speak(w, 0.6);
};
renderMine();

document.getElementById("startReview").onclick = () => {

document.getElementById("endReview").onclick = endReview;
function endReview() {
  document.getElementById("bankList").hidden = false;

function nextReview() {
  revItem = pickWeighted(WORD_LESSON[lesson], [...WORD_LESSON.slice(0, lesson).flat(), ...myItems()], revItem);
  document.getElementById("revWord").innerHTML = pitchHTML(revItem[0]);

}

// ===== 聽寫 =====
const dictBox = document.getElementById("dictBox");
const wordRomaji = w => [...w].map(c => c === "を" ? "o" : ROMAJI[c]).join("");
let dict = { items: [], idx: 0, token: 0, timers: [] };
const DICT_WAIT = 30;     // 每個字念完後等待的秒數
const DICT_RATE = 0.48;   // 聽寫語速（單字練習 0.6 再放慢 20%）

function dictClearTimers() { dict.timers.forEach(clearTimeout); dict.timers = []; }
function resetDict() {
  dict.token++;
  dictClearTimers();
  if (dictBox) dictIdle();
}
function pickDictWords(n) {
  const cur = WORD_LESSON[lesson], prev = WORD_LESSON.slice(0, lesson).flat(), out = [];
  while (out.length < n && out.length < cur.length + prev.length) {
    const c = cur.filter(x => !out.includes(x)), p = prev.filter(x => !out.includes(x));
    const pool = p.length && (!c.length || Math.random() >= 0.6) ? p : c;   // 本課 60%
    out.push(pool[Math.floor(Math.random() * pool.length)]);
  }
  return out;
}
// 念一個單字，念完後呼叫 cb（Android 偶爾不回報念完，加上備援）
// 每個詞念兩次：第一次完全念完後，等 2 秒再念第二次
const DICT_REPEAT_GAP = 2;   // 兩次之間的秒數
function speakWordThen(item, tk, cb) {
  const text = (item[3] || item[0]) + "。";
  // 念一次，念完（或備援時間到）後呼叫 next
  const once = next => {
    let done = false;
    const finish = () => { if (done || tk !== dict.token) return; done = true; next(); };
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    if (jaVoice) u.voice = jaVoice;
    u.rate = DICT_RATE;
    u.onend = finish;
    speechSynthesis.speak(u);
    dict.timers.push(setTimeout(finish, 8000));   // Android 偶爾不回報念完
  };
  speechSynthesis.cancel();
  dict.timers.push(setTimeout(() => {
    once(() => {
      dict.timers.push(setTimeout(() => {
        if (tk !== dict.token) return;
        once(cb);
      }, DICT_REPEAT_GAP * 1000));
    });
  }, 150));
}

function dictIdle() {
  dictBox.innerHTML = `
    <div class="card">
      <p style="margin:0 0 6px;font-size:17px;font-weight:600">聽寫小考</p>
      <p class="hint" style="margin:0">從學過的單字隨機抽 5 個，每個詞念兩次，念完後等 30 秒再念下一個。<br>準備好紙筆，用平假名寫下聽到的字。</p>
    </div>`;
  const r = document.createElement("div"); r.className = "row"; dictBox.appendChild(r);
  mkBtn(r, "開始聽寫", "primary", startDict);
}
function startDict() {
  dict.items = pickDictWords(5);
  if (!dict.items.length) { say("這一課還沒有單字可以考", "oops"); return; }
  runDict();
}
function runDict() {
  dict.token++;
  dictClearTimers();
  dict.idx = 0;
  say("仔細聽，寫下來喔");
  playDict(dict.token);
}
function dictScreen(status, showBar) {
  const n = dict.items.length;
  dictBox.innerHTML = `
    <div class="card">
      <div class="dict-count">${dict.idx + 1}<small> / ${n}</small></div>
      <div class="dots">${dict.items.map((_, i) => `<span class="${i < dict.idx ? "done" : i === dict.idx ? "now" : ""}"></span>`).join("")}</div>
      <div class="dict-status" id="dictStatus">${status}</div>
      ${showBar ? '<div class="bar"><i id="dictBar"></i></div>' : ""}
    </div>`;
}
function playDict(tk) {
  if (tk !== dict.token) return;
  const last = dict.idx >= dict.items.length - 1;
  const label = last ? "作答時間" : "下一個";
  // 從第一次開始念就計時 30 秒，兩次朗讀都在這 30 秒內
  dictScreen(`${label}：${DICT_WAIT} 秒`, true);
  const bar = document.getElementById("dictBar");
  requestAnimationFrame(() => { bar.style.transition = `width ${DICT_WAIT}s linear`; bar.style.width = "100%"; });
  for (let sec = DICT_WAIT - 1; sec >= 1; sec--) {
    dict.timers.push(setTimeout(() => {
      if (tk !== dict.token) return;
      const st = document.getElementById("dictStatus");
      if (st) st.textContent = `${label}：${sec} 秒`;
    }, (DICT_WAIT - sec) * 1000));
  }
  dict.timers.push(setTimeout(() => {
    if (tk !== dict.token) return;
    if (last) return dictEnd();   // 第五題也倒數完才進入結束畫面
    dict.idx++; playDict(tk);
  }, DICT_WAIT * 1000));
  speakWordThen(dict.items[dict.idx], tk, () => {});
}
function dictEnd() {
  const n = dict.items.length;
  dictBox.innerHTML = `
    <div class="card">
      <div class="dict-count">${n}<small> / ${n}</small></div>
      <div class="dots">${dict.items.map(() => '<span class="done"></span>').join("")}</div>
      <div class="dict-status">全部念完了！檢查一下你寫的字</div>
    </div>`;
  const r = document.createElement("div"); r.className = "row"; dictBox.appendChild(r);
  mkBtn(r, "再聽一次", "", runDict);
  mkBtn(r, "結束作答", "primary", dictAnswers);
  say("辛苦了！寫好就按結束作答", "happy");
}
function dictAnswers() {
  dict.token++;
  dictClearTimers();
  speechSynthesis.cancel();
  dictBox.innerHTML = '<p class="hint">答案（點一下可以聽發音）</p>';
  const list = document.createElement("div"); list.className = "words"; dictBox.appendChild(list);
  dict.items.forEach((item, i) => {
    const [w, kanji, mean] = item;
    const b = document.createElement("button");
    b.className = "word";
    b.innerHTML = `<span class="ans-no">${i + 1}</span>
      <span class="jp kana-font" lang="ja" style="min-width:100px">${pitchHTML(w)}</span>
      <span class="info"><div class="kanji" lang="ja">${kanji}</div><div class="ro">${wordRomaji(w)}</div><div class="mean">${mean}</div></span>${speakerSvg}`;
    b.onclick = () => speakWord(item);
    list.appendChild(b);
  });
  const r = document.createElement("div"); r.className = "row"; r.style.marginTop = "16px"; dictBox.appendChild(r);
  mkBtn(r, "再考一次", "primary", startDict);
  say("對答案囉！錯的字多聽幾次", "happy");
}

setLesson(0);

  leave() {
    resetDict();
    if (session) { session.cancelled = true; session.stop(); }
    if (myAudio) myAudio.pause();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  },
};

})();

<script>
/* ===== 首頁與切換 ===== */

(() => {
  const APPS = { sounds: { el: document.getElementById("sndApp"), api: () => window.SND_APP },
                 kana:   { el: document.getElementById("kanaApp"), api: () => window.KANA_APP } };
  const home = document.getElementById("home");
  let active = null;
  function show(next) {
    if (!APPS[next]) next = null;
    if (active && active !== next) { try { const a = APPS[active].api(); a && a.leave && a.leave(); } catch (e) {} }
    home.hidden = !!next;
    Object.entries(APPS).forEach(([k, v]) => v.el.hidden = k !== next);
    if (next && next !== active) { try { const a = APPS[next].api(); a && a.enter && a.enter(); } catch (e) {} }
    active = next;
    window.scrollTo(0, 0);
    document.title = next === "sounds" ? "日文聲音練習簿" : next === "kana" ? "五十音練習" : "日文學習";
    try { sessionStorage.setItem("jp-app-course", next || ""); } catch (e) {}
  }
  window.SHELL_HOME = () => show(null);
  document.addEventListener("click", e => {
    const o = e.target.closest("[data-open]");
    if (o) { show(o.dataset.open); return; }
    if (e.target.closest("[data-home]")) show(null);
  });
  let last = null;
  try { last = sessionStorage.getItem("jp-app-course"); } catch (e) {}
  show(last);

  // 共用語音設定
  const sel = document.getElementById("shellVoice");
  const note = document.getElementById("shellVoiceNote");
  const KEY = "kana-app-voice";
  const jaVoices = () => ("speechSynthesis" in window ? speechSynthesis.getVoices() : [])
    .filter(v => v.lang.replace("_", "-").startsWith("ja"));
  function current() {
    const vs = jaVoices(); let saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    return vs.find(v => v.name === saved) || vs.find(v => /enhanced|premium|增強|高品質/i.test(v.name)) || vs[0] || null;
  }
  function fill() {
    const vs = jaVoices(), cur = current();
    sel.innerHTML = "";
    if (!vs.length) {
      sel.disabled = true;
      sel.innerHTML = "<option>找不到日文語音</option>";
      note.textContent = "請到手機設定下載日文語音（iPhone：設定 › 輔助使用 › 朗讀內容 › 聲音 › 日文；Android：設定 › 文字轉語音）。";
      return;
    }
    sel.disabled = false;
    vs.forEach(v => {
      const o = document.createElement("option");
      o.value = v.name;
      o.textContent = v.name.replace(/\(.*?\)/, m => /enhanced|premium/i.test(m) ? "（增強品質）" : m);
      if (cur && v.name === cur.name) o.selected = true;
      sel.appendChild(o);
    });
    note.textContent = "兩個課程都會使用這裡選的語音。";
  }
  function test() {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance("こんにちは。いっしょに 日本語を 練習しましょう。");
    u.lang = "ja-JP"; const v = current(); if (v) u.voice = v; u.rate = 0.8;
    speechSynthesis.speak(u);
  }
  sel.onchange = () => {
    try { localStorage.setItem(KEY, sel.value); } catch (e) {}
    window.dispatchEvent(new Event("jvoicechange"));
    test();
  };
  document.getElementById("shellVoiceTest").onclick = test;
  if ("speechSynthesis" in window) speechSynthesis.addEventListener("voiceschanged", fill);
  window.addEventListener("jvoicechange", fill);
  fill();
})();

</script>
