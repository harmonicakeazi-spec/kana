<title>五十音練習</title>
<style>
:root {
  --snow: #FAF7F1;      /* 水彩紙般的雪白 */
  --surface: #FFFDF9;
  --ice: #EFE9E0;       /* 暖霧 */
  --ink: #2D2A2E;       /* 山雀羽毛的墨色 */
  --muted: #7D7468;
  --line: #E4DCD0;
  --ai: #3F6189;        /* 畫中淡藍天空的深色 */
  --ai-soft: #E6ECF2;
  --berry: #B4493C;     /* 冬天的果實：音調線、錯誤 */
  --berry-soft: #F6E4DF;
  --pine: #4E7A55;      /* 正確 */
  --pine-soft: #E4EEE2;
  --wing: #C49A8C;
  --on-ai: #FFFFFF;
  --chip: rgba(255, 253, 249, .78);
  --veil: rgba(250, 247, 241, 0);
  --ok: var(--pine); --ok-soft: var(--pine-soft); --ng: var(--berry); --ng-soft: var(--berry-soft);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --snow: #1A1715; --surface: #24201D; --ice: #2D2824; --ink: #F1ECE4; --muted: #A89E92;
    --line: #3A332D; --ai: #9DB8D6; --ai-soft: #2A3442; --berry: #EE958A; --berry-soft: #3B2724;
    --pine: #9CC79F; --pine-soft: #24322A; --wing: #D2AE9F; --on-ai: #1A1715;
    --chip: rgba(36, 32, 29, .8);
    --veil: rgba(26, 23, 21, .5);
    --bird-dim: brightness(.56) saturate(.9);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--snow); color: var(--ink);
  font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Hiragino Sans", sans-serif;
  font-size: 16px; line-height: 1.5;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.kana-font { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Noto Serif CJK JP", "Source Han Serif JP", serif; }
.wrap { max-width: 520px; margin: 0 auto; padding: 0 16px 48px; }
button:focus-visible { outline: 3px solid var(--ai); outline-offset: 2px; }

.top h1 {
  text-shadow: 0 0 12px var(--snow);
  font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "PingFang TC", sans-serif;
  font-size: 22px; font-weight: 700; margin: 0; letter-spacing: .04em;
}
.perch { display: flex; align-items: center; gap: 12px; margin: 10px 0 14px; }
.mascot { width: 150px; flex-shrink: 0; }
.mascot img {
  width: 100%; height: auto; display: block;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent), linear-gradient(transparent, #000 8%, #000 92%, transparent);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent), linear-gradient(transparent, #000 8%, #000 92%, transparent);
  mask-composite: intersect;
  filter: var(--bird-dim, none);
}
.mascot.hop { animation: hop .45s ease-out; }
.mascot.shake { animation: shake .4s ease-in-out; }
@keyframes shake { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
@keyframes hop { 30% { transform: translateY(-10px); } 60% { transform: translateY(0); } 80% { transform: translateY(-3px); } }
.bubble {
  position: relative; flex: 1; background: var(--chip); border-radius: 18px;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  padding: 10px 14px; font-size: 15px; min-height: 44px;
}
.bubble::before {
  content: ""; position: absolute; left: -7px; top: 50%; margin-top: -8px;
  border: 8px solid transparent; border-right-color: var(--chip); border-left: 0;
}

.lessons { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
.lessons::-webkit-scrollbar { display: none; }
.lessons button {
  flex: 0 0 auto; padding: 7px 14px; border-radius: 999px;
  border: none; background: var(--chip); color: var(--ink); font-size: 14px; cursor: pointer;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.lessons button[aria-pressed="true"] { background: var(--ai); color: var(--on-ai); }

.learned { display: flex; flex-wrap: wrap; gap: 2px; }
.learned span { width: 28px; height: 28px; display: grid; place-items: center; font-size: 17px; border-radius: 8px; color: var(--ink); opacity: .6; text-shadow: 0 0 8px var(--snow); }
.learned span.new { color: var(--ai); background: var(--chip); font-weight: 600; opacity: 1; text-shadow: none; }

/* ---------- 分頁 ---------- */
.tabs { display: flex; gap: 4px; background: var(--ice); padding: 4px; border-radius: 14px; margin-bottom: 20px; }
.tabs button {
  flex: 1; background: none; border: none; color: var(--muted);
  padding: 8px 0; font-size: 13px; border-radius: 10px; cursor: pointer;
}
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; }

.panel[hidden] { display: none; }
.hint { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.score { color: var(--muted); font-size: 14px; text-align: center; margin-top: 16px; }
.notice { background: var(--berry-soft); color: var(--berry); padding: 10px 12px; border-radius: 12px; font-size: 14px; margin-bottom: 16px; }

/* ---------- 聽音選字 ---------- */
.play {
  display: flex; align-items: center; justify-content: center;
  width: 112px; height: 112px; margin: 4px auto 24px; border-radius: 50%;
  border: 6px solid var(--ice); background: var(--ai); color: var(--on-ai); cursor: pointer;
}
.play svg { width: 44px; height: 44px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choices button {
  height: 92px; font-size: 48px; border-radius: 18px; cursor: pointer;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  transition: background .15s, border-color .15s;
}
.choices button.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.choices button.ng { background: var(--ng-soft); border-color: var(--ng); color: var(--ng); }
.feedback { min-height: 26px; text-align: center; margin-top: 12px; font-size: 15px; }
.feedback.ok { color: var(--ok); }
.feedback.ng { color: var(--ng); }

/* ---------- 卡片與按鈕 ---------- */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 24px; text-align: center; padding: 26px 16px 20px; margin-bottom: 14px; }
.big { font-size: 136px; line-height: 1.1; }
.bigword { font-size: 60px; line-height: 1.3; }
.romaji { min-height: 34px; font-size: 22px; color: var(--ai); letter-spacing: .05em; }
.sub { min-height: 26px; color: var(--muted); font-size: 16px; }
.hide { visibility: hidden; }
.row { display: flex; gap: 10px; margin-bottom: 10px; }
.btn {
  flex: 1; padding: 14px 0; border-radius: 14px; font-size: 16px; cursor: pointer;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--on-ai); }
.btn.good { border-color: var(--ok); color: var(--ok); }
.btn.bad { border-color: var(--ng); color: var(--ng); }
.btn.mic.listening { background: var(--berry); border-color: var(--berry); color: #fff; }
.btn[disabled] { opacity: .45; }

/* ---------- 單字 ---------- */
.toggle { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 15px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--ai); }
.words { display: flex; flex-direction: column; gap: 8px; }
.group-title { font-size: 14px; color: var(--muted); margin: 18px 0 2px; }
.word {
  display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
  background: var(--surface); border: 2px solid var(--line); border-radius: 16px;
  padding: 12px 14px; color: var(--ink); cursor: pointer; font: inherit;
}
.word .jp { font-size: 28px; min-width: 120px; }
.word .info { flex: 1; }
.word .kanji { color: var(--muted); font-size: 14px; }
.word .mean { font-size: 16px; }
.word .ro { color: var(--ai); font-size: 14px; letter-spacing: .03em; }
.word.covered .mean, .word.covered .kanji { filter: blur(6px); opacity: .5; }
.word svg { width: 22px; height: 22px; color: var(--ai); flex-shrink: 0; }
.m { display: inline-block; position: relative; padding-top: 4px; border-top: 2px solid transparent; }
.m.h { border-top-color: var(--berry); }
.m.d::after { content: ""; position: absolute; right: -1px; top: -2px; height: 40%; border-right: 2px solid var(--berry); }
.legend .m { padding-top: 2px; }
.addform { text-align: left; padding: 18px 16px 16px; }
.addform[hidden] { display: none; }
.addform label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
.addform input {
  display: block; width: 100%; margin-top: 4px; padding: 11px 12px; font-size: 17px;
  border: 2px solid var(--line); border-radius: 12px; background: var(--snow); color: var(--ink);
}
.addform input:focus { outline: none; border-color: var(--ai); }
.addform .feedback { margin: 0 0 10px; min-height: 0; text-align: left; }
.dict-hint { margin: -4px 0 12px; font-size: 14px; color: var(--muted); }
.dict-hint:empty { display: none; }
.cands { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.cands button {
  border: 2px solid var(--line); background: var(--snow); color: var(--ink);
  border-radius: 12px; padding: 7px 12px; font-size: 15px; cursor: pointer; text-align: left;
}
.cands button b { font-weight: 600; margin-right: 6px; }
.cands button[aria-pressed="true"] { border-color: var(--ai); background: var(--ai-soft); }
.mine { display: flex; gap: 8px; align-items: stretch; }
.mine .word { flex: 1; }
.del { flex: 0 0 48px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--berry); font-size: 20px; cursor: pointer; }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }

/* ---------- 聽寫 ---------- */
.dict-count { font-size: 56px; font-weight: 600; color: var(--ai); line-height: 1.1; }
.dict-count small { font-size: 22px; color: var(--muted); font-weight: 400; }
.dots { display: flex; justify-content: center; gap: 8px; margin: 14px 0; }
.dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.dots span.done { background: var(--ai); }
.dots span.now { background: var(--berry); }
.dict-status { color: var(--muted); font-size: 15px; min-height: 24px; }
.bar { height: 6px; background: var(--ice); border-radius: 3px; overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; width: 0; background: var(--ai); }
.ans-no { width: 28px; height: 28px; border-radius: 50%; background: var(--ai-soft); color: var(--ai); display: grid; place-items: center; font-size: 14px; font-weight: 600; flex-shrink: 0; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>五十音練習</h1>
    <div class="perch">
      <div class="mascot" id="mascot" aria-hidden="true"></div>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </div>
    <div class="lessons" id="lessons"></div>
    <div class="learned kana-font" lang="ja" id="learned" aria-label="已學過的字"></div>
  </header>

  <div id="voiceNotice" class="notice" hidden></div>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="listen">聽音選字</button>
    <button role="tab" aria-selected="false" data-tab="read">看字念音</button>
    <button role="tab" aria-selected="false" data-tab="dict">聽寫</button>
    <button role="tab" aria-selected="false" data-tab="words">本課單字</button>
    <button role="tab" aria-selected="false" data-tab="bank">單字庫</button>
  </nav>

  <!-- 聽音選字 -->
  <section class="panel" id="listen">

function pitchHTML(w) {
  const m = [...w], n = ACCENT[w];
  if (n === undefined) return w;
  return m.map((c, i) => {
    const high = n === 0 ? i > 0 || m.length === 1 : (n === 1 ? i === 0 : i > 0 && i < n);
    const drop = n > 0 && i === n - 1;
    return `<span class="m${high ? " h" : ""}${drop ? " d" : ""}">${c}</span>`;
  }).join("");
}

const lessonOf = w => Math.max(...[...w].map(c => Math.floor(KANA.indexOf(c) / 5)));

WORDS.forEach(item => {

// 單音：用正常念法慢速念兩次，中間間隔一秒
let kanaTimer = null;
function kanaUtter(k) {
  const u = new SpeechSynthesisUtterance(k);
  u.lang = "ja-JP";
  if (jaVoice) u.voice = jaVoice;
  u.rate = 0.7;
  return u;
}
function speakKana(k) {
  if (!("speechSynthesis" in window)) return;
  clearTimeout(kanaTimer);
  speechSynthesis.cancel();
  kanaTimer = setTimeout(() => {
    let done = false;
    const second = () => {
      if (done) return;
      done = true;
      clearTimeout(kanaTimer);
      kanaTimer = setTimeout(() => speechSynthesis.speak(kanaUtter(k)), 1000);
    };
    const first = kanaUtter(k);
    first.onend = second;
    speechSynthesis.speak(first);
    kanaTimer = setTimeout(second, 2000);   // 備援：沒收到 onend 時，2 秒後照樣念第二次
  }, 120);
}

// 單字：放慢速度；結尾加「。」讓語音照完整句子的語氣自然收尾，不會突然切斷；
// 先停一下再念，避免 iPhone 把開頭第一個音吃掉
function speakWord(item) {
  if (!("speechSynthesis" in window)) return;
  clearTimeout(kanaTimer);
  speechSynthesis.cancel();

    u.rate = 0.6;

// 本課 60%、之前各課合計 40%（第一課則全部是本課）
function pickWeighted(current, previous, last) {
  let first = current, second = previous;
  if (previous.length && Math.random() >= 0.6) [first, second] = [previous, current];
  const a = first.filter(x => x !== last);
  if (a.length) return a[Math.floor(Math.random() * a.length)];
  const b = second.filter(x => x !== last);
  return b.length ? b[Math.floor(Math.random() * b.length)] : first[0];
}

const pickKana = last => pickWeighted(LESSONS[lesson], prevKana(), last);
function pickNew(pool, last) {

  let k; do { k = pool[Math.floor(Math.random() * pool.length)]; } while (k === last);

}

const mascotEl = document.getElementById("mascot");
const bubbleEl = document.getElementById("bubble");
const pickOne = a => a[Math.floor(Math.random() * a.length)];
mascotEl.innerHTML = `<img src="${MASCOT_IMG}" alt="">`;
function say(text, mood = "normal") {
  bubbleEl.textContent = text;
  const anim = mood === "happy" ? "hop" : mood === "oops" ? "shake" : "";
  mascotEl.classList.remove("hop", "shake");
  if (anim) { void mascotEl.offsetWidth; mascotEl.classList.add(anim); }
}
const PRAISE = ["答對了！すごい！", "很棒，繼續保持", "いいね！就是這樣", "完全正確！"];
const CHEER = ["沒關係，再聽一次", "差一點點，慢慢來", "だいじょうぶ！再試試"];
const TAB_TALK = {
  listen: "仔細聽，選出聽到的字",
  read: "看到字就大聲念出來吧",
  dict: "準備好紙筆，我們來聽寫",
  words: "點單字可以聽發音喔",
  bank: "複習學過的單字吧",
};

// ===== 課程選單 =====
const lessonsEl = document.getElementById("lessons");
LESSONS.forEach((_, i) => {
  const b = document.createElement("button");
  b.textContent = `第${i + 1}課`;
  b.onclick = () => setLesson(i);
  lessonsEl.appendChild(b);
});
function setLesson(i) {
  lesson = i;
  [...lessonsEl.children].forEach((b, j) => b.setAttribute("aria-pressed", j === i));
  const el = document.getElementById("learned");
  el.innerHTML = "";
  learned().forEach(k => {
    const s = document.createElement("span");
    s.textContent = k;
    if (LESSONS[lesson].includes(k)) s.className = "new";
    el.appendChild(s);
  });
  listenStats = { ok: 0, total: 0 };
  readStats = { ok: 0, total: 0 };
  say(`第${i + 1}課：${LESSONS[i].join("")}，一起加油！`);
  resetDict();
  newListen(false);
  newRead();
  renderWords();
  renderBank();
  endReview();
}

// ===== 分頁 =====
document.querySelectorAll(".tabs button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
    document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== b.dataset.tab);
    if (b.dataset.tab !== "dict") resetDict();
    say(TAB_TALK[b.dataset.tab]);
  };
});

// ===== 聽音選字 =====
let listenAnswer = null, listenLocked = false, listenStats = { ok: 0, total: 0 }, firstTry = true;
const choicesEl = document.getElementById("choices");
const feedbackEl = document.getElementById("feedback");
document.getElementById("playBtn").onclick = () => speakKana(listenAnswer);

function newListen(autoplay = true) {
  const pool = learned();
  listenAnswer = pickKana(listenAnswer);
  const others = shuffle(pool.filter(k => k !== listenAnswer && k !== SAME_SOUND[listenAnswer])).slice(0, 3);
  const opts = shuffle([listenAnswer, ...others]);
  choicesEl.innerHTML = "";
  feedbackEl.textContent = ""; feedbackEl.className = "feedback";
  listenLocked = false; firstTry = true;
  opts.forEach(k => {
    const b = document.createElement("button");
    b.textContent = k;
    b.onclick = () => chooseListen(b, k);
    choicesEl.appendChild(b);
  });
  updateListenScore();
  if (autoplay) setTimeout(() => speakKana(listenAnswer), 250);
}
function chooseListen(btn, k) {
  if (listenLocked) return;
  if (k === listenAnswer) {
    listenLocked = true;
    btn.classList.add("ok");
    if (firstTry) listenStats.ok++;
    listenStats.total++;
    feedbackEl.textContent = `答對了！${k}（${ROMAJI[k]}）`;
    say(pickOne(PRAISE), "happy");
    feedbackEl.className = "feedback ok";
    updateListenScore();
    setTimeout(newListen, 1300);
  } else {
    btn.classList.add("ng");
    firstTry = false;
    feedbackEl.textContent = `這是 ${k}（${ROMAJI[k]}），再聽一次`;
    say(pickOne(CHEER), "oops");
    feedbackEl.className = "feedback ng";
    speakKana(listenAnswer);
  }
}
function updateListenScore() {
  document.getElementById("listenScore").textContent = listenStats.total ? `一次答對 ${listenStats.ok} / ${listenStats.total} 題` : "";
}

// ===== 看字念音（含語音辨識）=====
// 辨識單一個音時，手機常會寫成同音的漢字，所以列出常見同音字一起比對
const HOMOPHONES = {
  あ:"亜阿", い:"胃井医意易", う:"鵜卯", え:"絵江柄餌", お:"尾緒御をオ",
  か:"蚊化課可科下家", き:"木気黄期機器", く:"九区句苦9", け:"毛気家化", こ:"子個粉戸湖故古",
  さ:"差佐左砂", し:"四市死詩氏師4", す:"巣酢素州", せ:"背瀬世", そ:"祖素曽",
  た:"田他多", ち:"血地知千値", つ:"津都通", て:"手", と:"戸都斗十",
  な:"名菜那", に:"二荷似煮2", ぬ:"奴", ね:"根値音寝", の:"野乃之",
  は:"葉歯刃派波", ひ:"日火比非灯", ふ:"府符譜不負婦", へ:"屁辺", ほ:"帆穂歩保",
  ま:"間真魔馬", み:"実身三見味3", む:"無六夢", め:"目芽女", も:"藻喪茂",
  や:"矢屋夜野", ゆ:"湯由", よ:"世夜四代予余", ら:"羅等", り:"理利里李",
  る:"留流", れ:"例礼", ろ:"炉路呂", わ:"輪和環", を:"お尾緒御オ", ん:"ン",
};
const toHira = s => s.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
function heardMatches(text, kana) {
  const t = toHira(text).replace(/[\sー。、！？!?.,~〜]/g, "").toLowerCase();
  if (!t) return false;
  if ([...t].every(c => c === kana || c === SAME_SOUND[kana])) return true;    // 「か」「かか」
  if ([...t].every(c => (HOMOPHONES[kana] || "").includes(c))) return true;   // 「蚊」「木」
  const r = ROMAJI[kana].split("（")[0];
  return t === r || t === r.repeat(2);
}

const Recog = window.SpeechRecognition || window.webkitSpeechRecognition;
const CAN_RECORD = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
let readKana = null, readStats = { ok: 0, total: 0 };
let session = null;      // 正在錄音的這一次
let take = null;         // 目前保留的錄音：{ url, heard[], recogActive }
let revealed = false, audioCtx = null, myAudio = null;
const readActions = document.getElementById("readActions");
const romajiEl = document.getElementById("readRomaji");
const readFb = document.getElementById("readFeedback");
const mkBtn = (parent, text, cls, fn) => { const b = document.createElement("button"); b.className = "btn " + cls; b.textContent = text; b.onclick = fn; parent.appendChild(b); return b; };
const mkRow = () => { const r = document.createElement("div"); r.className = "row"; readActions.appendChild(r); return r; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const setFb = (text, cls = "") => { readFb.textContent = text; readFb.className = "feedback " + cls; };

function dropTake() {
  if (take && take.url) URL.revokeObjectURL(take.url);
  take = null;
}
function newRead() {
  if (session) { session.cancelled = true; session.stop(); }
  if (myAudio) myAudio.pause();
  dropTake();
  revealed = false;
  readKana = pickKana(readKana);
  document.getElementById("readKana").textContent = readKana;
  romajiEl.textContent = ROMAJI[readKana];
  romajiEl.classList.add("hide");
  setFb("");
  renderReadButtons();
  updateReadScore();
}

function renderReadButtons(manual = false) {
  readActions.innerHTML = "";
  if (!revealed) {
    if (CAN_RECORD) {
      const r1 = mkRow();
      const recBtn = mkBtn(r1, session ? "錄音中…（點一下停止）" : (take ? "重錄" : "我來念"), "mic" + (session ? " listening" : ""), onRecBtn);
      const playBtn = mkBtn(r1, "播放我的錄音", "", playMine);
      playBtn.disabled = !take || !!session;
    }
    mkBtn(mkRow(), "看答案", "primary", revealRead);
  } else {
    const r1 = mkRow();
    mkBtn(r1, "正確發音", "", () => speakKana(readKana));
    if (take) mkBtn(r1, "我的錄音", "", playMine);
    const r2 = mkRow();
    if (manual) {
      mkBtn(r2, "念錯了", "bad", () => { readStats.total++; newRead(); });
      mkBtn(r2, "念對了", "good", () => { readStats.ok++; readStats.total++; newRead(); });
    } else {
      mkBtn(r2, "下一個", "primary", newRead);
    }
  }
}

function playMine() {
  if (!take) return;
  speechSynthesis.cancel();
  if (myAudio) myAudio.pause();
  myAudio = new Audio(take.url);
  myAudio.play().catch(() => setFb("無法播放錄音", "ng"));
}

function onRecBtn() {
  if (session) { session.stop(); return; }   // 錄音中再按一次 = 手動停止
  startRecording();
}

async function startRecording() {
  speechSynthesis.cancel();
  if (myAudio) myAudio.pause();
  // iPhone 規定音訊功能要在點擊當下啟動，所以先建立
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();

  const s = { chunks: [], heard: [], voiced: false, stopped: false, cancelled: false, recogActive: false };
  session = s;
  s.stop = () => {
    if (s.stopped) return;
    s.stopped = true;
    try { s.src && s.src.disconnect(); } catch (e) {}
    try { s.recog && s.recog.stop(); } catch (e) {}
    if (s.mr && s.mr.state !== "inactive") s.mr.stop();
    else finish();
  };
  setFb("請念…（念完會自動停止）");
  renderReadButtons();

  // 同時啟動語音辨識，用來評分
  if (Recog) {
    try {
      const r = new Recog();
      r.lang = "ja-JP"; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
      r.onresult = ev => { for (const res of ev.results) for (const alt of res) s.heard.push(alt.transcript.trim()); };
      r.onerror = () => {};
      r.onend = () => { s.recogActive = false; };
      r.start();
      s.recog = r; s.recogActive = true;
    } catch (e) {}
  }

  try {
    s.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    session = null;
    try { s.recog && s.recog.abort(); } catch (e2) {}
    setFb(IS_ANDROID ? "沒有麥克風權限。請點網址列左邊的圖示 → 權限 → 允許麥克風。"
                     : "沒有麥克風權限。請在 Safari 允許使用麥克風（網址列「ぁあ」→ 網站設定）。", "ng");
    renderReadButtons();
    return;
  }
  if (s.cancelled || s.stopped) { s.stream.getTracks().forEach(t => t.stop()); return; }

  // 錄音
  s.mr = new MediaRecorder(s.stream);
  s.mr.ondataavailable = e => { if (e.data && e.data.size) s.chunks.push(e.data); };
  s.mr.onstop = finish;
  s.mr.start();

  // 偵測聲音：先量環境噪音，聽到聲音後安靜 0.9 秒就自動停止
  s.src = audioCtx.createMediaStreamSource(s.stream);
  const an = audioCtx.createAnalyser();
  an.fftSize = 1024;
  s.src.connect(an);
  const buf = new Float32Array(an.fftSize);
  const t0 = performance.now();
  let floor = 0, floorN = 0, lastVoice = 0, voiceMs = 0, lastT = t0;
  (function tick() {
    if (s.stopped) return;
    an.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    const now = performance.now();
    if (now - t0 < 250) { floor += rms; floorN++; }
    else {
      const th = Math.max(0.015, (floor / Math.max(floorN, 1)) * 3);
      if (rms > th) { voiceMs += now - lastT; lastVoice = now; if (voiceMs > 80) s.voiced = true; }
      if (s.voiced && now - lastVoice > 900) return s.stop();
      if (!s.voiced && now - t0 > 6000) return s.stop();
      if (now - t0 > 8000) return s.stop();
    }
    lastT = now;
    requestAnimationFrame(tick);
  })();

  function finish() {
    if (s.stream) s.stream.getTracks().forEach(t => t.stop());   // 關掉麥克風
    if (session === s) session = null;
    if (s.cancelled) return;
    if (s.voiced || s.heard.length) {
      dropTake();   // 新錄音蓋掉舊的
      take = {
        url: URL.createObjectURL(new Blob(s.chunks, { type: (s.mr && s.mr.mimeType) || "audio/mp4" })),
        get heard() { return s.heard; },
        get recogActive() { return s.recogActive; },
      };
      setFb("錄好了！可以播放、重錄，或按「看答案」");
    } else {
      setFb(take ? "沒聽到聲音，保留上一次的錄音" : "沒聽到聲音，再按一次試試", "ng");
    }
    renderReadButtons();
  }
}

async function revealRead() {
  // 還在錄音就先停止
  if (session) {
    session.stop();
    for (let i = 0; i < 20 && session; i++) await sleep(100);
  }
  // 等語音辨識結果（最多 2 秒）
  for (let i = 0; i < 20 && take && take.recogActive && !take.heard.length; i++) await sleep(100);

  revealed = true;
  romajiEl.classList.remove("hide");
  speakKana(readKana);

  if (take && take.heard.length) {
    const ok = take.heard.some(h => heardMatches(h, readKana));
    readStats.total++;
    if (ok) readStats.ok++;
    setFb(ok ? `正確！念得很好 ✓` : `不正確 ✗　聽起來像「${take.heard[0]}」`, ok ? "ok" : "ng");
    say(ok ? pickOne(PRAISE) : "比較一下兩個錄音，再試一次", ok ? "happy" : "oops");
    renderReadButtons(false);
  } else if (take) {
    setFb("這支手機沒辦法同時錄音和辨識，請播放你的錄音和正確發音比較後自評");
    renderReadButtons(true);
  } else {
    setFb("沒有錄音，請自評");
    renderReadButtons(true);
  }
  updateReadScore();
}
function updateReadScore() {
  document.getElementById("readScore").textContent = readStats.total ? `念對 ${readStats.ok} / ${readStats.total} 個` : "";
}

  covered = t.checked;
  document.querySelectorAll(".coverToggle").forEach(x => x.checked = covered);
  renderWords(); renderBank(); renderMine();

function wordCard(item) {
  const [w, kanji, mean] = item;
  const b = document.createElement("button");
  b.className = "word" + (covered ? " covered" : "");
  b.innerHTML = `<span class="jp kana-font" lang="ja">${pitchHTML(w)}</span>
    <span class="info"><div class="kanji" lang="ja">${kanji}</div><div class="mean">${mean}</div></span>${speakerSvg}`;
  b.onclick = () => { b.classList.remove("covered"); speakWord(item); };
  return b;
}
function renderWords() {
  const el = document.getElementById("wordList");
  el.innerHTML = "";
  const list = WORD_LESSON[lesson];
  if (!list.length) { el.innerHTML = '<div class="empty">這一課沒有新單字</div>'; return; }
  list.forEach(item => el.appendChild(wordCard(item)));
}
function renderBank() {
  const el = document.getElementById("bankWords");
  el.innerHTML = "";
  for (let i = 0; i <= lesson; i++) {
    if (!WORD_LESSON[i].length) continue;
    const h = document.createElement("div");
    h.className = "group-title";
    h.textContent = `第${i + 1}課（${LESSONS[i].join("")}）`;
    el.appendChild(h);
    WORD_LESSON[i].forEach(item => el.appendChild(wordCard(item)));
  }
}

DICT_DATA.split("\n").forEach(line => {
  const [w, k, m] = line.split("|");
  const key = toHira(w);
  if (!DICT.has(key)) DICT.set(key, []);

// ===== 我的單字（存在這支手機的瀏覽器裡）=====
const MY_KEY = "kana-app-my-words";
let myWords = [];
try { myWords = JSON.parse(localStorage.getItem(MY_KEY) || "[]"); } catch (e) { myWords = []; }
function saveMyWords() {
  try { localStorage.setItem(MY_KEY, JSON.stringify(myWords)); return true; } catch (e) { return false; }
}
const myItems = () => myWords.map(o => { const a = [o.w, o.k || "", o.m]; a.custom = true; return a; });

function renderMine() {
  const el = document.getElementById("myWords");
  el.innerHTML = "";
  if (!myWords.length) { el.innerHTML = '<div class="hint" style="margin:4px 0 0">還沒有自己的單字。看到新單字時，按下面的按鈕加進來。</div>'; return; }
  myItems().forEach((item, i) => {
    const wrap = document.createElement("div");
    wrap.className = "mine";
    wrap.appendChild(wordCard(item));
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.setAttribute("aria-label", `刪除 ${item[0]}`);
    del.onclick = () => {
      if (!confirm(`要刪除「${item[0]}」嗎？`)) return;
      myWords.splice(i, 1); saveMyWords(); renderMine();
    };
    wrap.appendChild(del);
    el.appendChild(wrap);
  });
}
const addForm = document.getElementById("addForm");
const addMsg = document.getElementById("addMsg");
document.getElementById("addToggle").onclick = () => {
  addForm.hidden = !addForm.hidden;
  addMsg.textContent = "";
  if (!addForm.hidden) document.getElementById("inKana").focus();
};
document.getElementById("addCancel").onclick = () => { addForm.hidden = true; };

// 輸入假名後自動查辭典
const inKana = document.getElementById("inKana");
const inKanji = document.getElementById("inKanji");
const inMean = document.getElementById("inMean");
const dictHint = document.getElementById("dictHint");
let lookupTimer = null;
function fillFrom(e) {
  // 只覆蓋空白或之前自動填入的欄位，不會蓋掉你自己打的字
  if (!inKanji.value || inKanji.dataset.auto) { inKanji.value = e.k; inKanji.dataset.auto = "1"; }
  if (!inMean.value || inMean.dataset.auto) { inMean.value = e.m; inMean.dataset.auto = "1"; }
}
function clearAuto() {
  [inKanji, inMean].forEach(el => { if (el.dataset.auto) { el.value = ""; delete el.dataset.auto; } });
}
[inKanji, inMean].forEach(el => el.addEventListener("input", () => delete el.dataset.auto));
function lookupKana() {
  const key = toHira(inKana.value.trim().replace(/\s+/g, ""));
  dictHint.innerHTML = "";
  clearAuto();
  if (!key) return;
  const found = DICT.get(key);
  if (!found) {
    if (key.length >= 2) dictHint.textContent = "辭典裡找不到這個字，請自己填寫漢字和意思。";
    return;
  }
  if (found.length === 1) {
    fillFrom(found[0]);
    dictHint.textContent = "已從辭典自動填入，可以再修改。";
    return;
  }
  dictHint.textContent = `這個讀音有 ${found.length} 個意思，請選一個：`;
  const box = document.createElement("div");
  box.className = "cands";
  found.forEach(e => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<b lang="ja">${e.k || e.w}</b>${e.m}`;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => {
      box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
      clearAuto();
      fillFrom(e);
    };
    box.appendChild(b);
  });
  dictHint.appendChild(box);
}
inKana.addEventListener("input", () => { clearTimeout(lookupTimer); lookupTimer = setTimeout(lookupKana, 300); });
document.getElementById("addSave").onclick = () => {
  const w = document.getElementById("inKana").value.trim().replace(/\s+/g, "");
  const k = document.getElementById("inKanji").value.trim();
  const m = document.getElementById("inMean").value.trim();
  if (!w) return addMsg.textContent = "請輸入假名";
  if (!/^[\u3041-\u3096\u30A1-\u30FAー]+$/.test(w)) return addMsg.textContent = "假名欄只能輸入平假名或片假名";
  if (!m) return addMsg.textContent = "請輸入中文意思";
  if (myWords.some(o => o.w === w && (o.k || "") === k)) return addMsg.textContent = "這個單字已經加過了";
  myWords.push({ w, k, m });
  const saved = saveMyWords();
  ["inKana", "inKanji", "inMean"].forEach(id => { const el = document.getElementById(id); el.value = ""; delete el.dataset.auto; });
  dictHint.innerHTML = "";
  addForm.hidden = true;
  renderMine();
  say(saved ? `記住「${w}」了！` : "已加入，但這個瀏覽器無法保存，關掉後會消失", saved ? "happy" : "oops");
  speak(w, 0.6);
};
renderMine();

// ===== 單字庫：隨機複習 =====
let revItem = null, revStats = { ok: 0, total: 0 };
const allLearnedWords = () => WORD_LESSON.slice(0, lesson + 1).flat();
document.getElementById("startReview").onclick = () => {
  revStats = { ok: 0, total: 0 };
  document.getElementById("bankList").hidden = true;
  document.getElementById("reviewBox").hidden = false;
  nextReview();
};
document.getElementById("endReview").onclick = endReview;
function endReview() {
  document.getElementById("bankList").hidden = false;
  document.getElementById("reviewBox").hidden = true;
}
function nextReview() {
  revItem = pickWeighted(WORD_LESSON[lesson], [...WORD_LESSON.slice(0, lesson).flat(), ...myItems()], revItem);
  document.getElementById("revWord").innerHTML = pitchHTML(revItem[0]);
  document.getElementById("revKanji").textContent = revItem[1];
  document.getElementById("revMean").textContent = revItem[2];
  document.getElementById("revKanji").classList.add("hide");
  document.getElementById("revMean").classList.add("hide");
  const box = document.getElementById("revActions");
  box.innerHTML = "";
  mkBtn(box, "聽發音", "", () => speakWord(revItem));
  mkBtn(box, "看意思", "primary", () => {
    document.getElementById("revKanji").classList.remove("hide");
    document.getElementById("revMean").classList.remove("hide");
    speakWord(revItem);
    box.innerHTML = "";
    mkBtn(box, "不記得", "bad", () => { revStats.total++; nextReview(); });
    mkBtn(box, "記得", "good", () => { revStats.ok++; revStats.total++; nextReview(); });
  });
  document.getElementById("revScore").textContent = revStats.total ? `記得 ${revStats.ok} / ${revStats.total} 個` : "";
}

// ===== 聽寫 =====
const dictBox = document.getElementById("dictBox");
const wordRomaji = w => [...w].map(c => c === "を" ? "o" : ROMAJI[c]).join("");
let dict = { items: [], idx: 0, token: 0, timers: [] };
const DICT_WAIT = 30;     // 每個字念完後等待的秒數
const DICT_RATE = 0.48;   // 聽寫語速（單字練習 0.6 再放慢 20%）

function dictClearTimers() { dict.timers.forEach(clearTimeout); dict.timers = []; }
function resetDict() {
  dict.token++;
  dictClearTimers();
  if (dictBox) dictIdle();
}
function pickDictWords(n) {
  const cur = WORD_LESSON[lesson], prev = WORD_LESSON.slice(0, lesson).flat(), out = [];
  while (out.length < n && out.length < cur.length + prev.length) {
    const c = cur.filter(x => !out.includes(x)), p = prev.filter(x => !out.includes(x));
    const pool = p.length && (!c.length || Math.random() >= 0.6) ? p : c;   // 本課 60%
    out.push(pool[Math.floor(Math.random() * pool.length)]);
  }
  return out;
}
// 念一個單字，念完後呼叫 cb（Android 偶爾不回報念完，加上備援）
function speakWordThen(item, tk, cb) {
  let done = false;
  const finish = () => { if (done || tk !== dict.token) return; done = true; cb(); };
  speechSynthesis.cancel();
  dict.timers.push(setTimeout(() => {
    const u = new SpeechSynthesisUtterance((item[3] || item[0]) + "。");
    u.lang = "ja-JP";
    if (jaVoice) u.voice = jaVoice;
    u.rate = DICT_RATE;
    u.onend = finish;
    speechSynthesis.speak(u);
    dict.timers.push(setTimeout(finish, 8000));
  }, 150));
}

function dictIdle() {
  dictBox.innerHTML = `
    <div class="card">
      <p style="margin:0 0 6px;font-size:17px;font-weight:600">聽寫小考</p>
      <p class="hint" style="margin:0">從學過的單字隨機抽 5 個，每個念完會等 30 秒再念下一個。<br>準備好紙筆，用平假名寫下聽到的字。</p>
    </div>`;
  const r = document.createElement("div"); r.className = "row"; dictBox.appendChild(r);
  mkBtn(r, "開始聽寫", "primary", startDict);
}
function startDict() {
  dict.items = pickDictWords(5);
  if (!dict.items.length) { say("這一課還沒有單字可以考", "oops"); return; }
  runDict();
}
function runDict() {
  dict.token++;
  dictClearTimers();
  dict.idx = 0;
  say("仔細聽，寫下來喔");
  playDict(dict.token);
}
function dictScreen(status, showBar) {
  const n = dict.items.length;
  dictBox.innerHTML = `
    <div class="card">
      <div class="dict-count">${dict.idx + 1}<small> / ${n}</small></div>
      <div class="dots">${dict.items.map((_, i) => `<span class="${i < dict.idx ? "done" : i === dict.idx ? "now" : ""}"></span>`).join("")}</div>
      <div class="dict-status" id="dictStatus">${status}</div>
      ${showBar ? '<div class="bar"><i id="dictBar"></i></div>' : ""}
    </div>`;
}
function playDict(tk) {
  if (tk !== dict.token) return;
  dictScreen("正在念…", false);
  speakWordThen(dict.items[dict.idx], tk, () => {
    if (dict.idx >= dict.items.length - 1) return dictEnd();
    // 倒數 30 秒
    dictScreen(`下一個：${DICT_WAIT} 秒`, true);
    const bar = document.getElementById("dictBar");
    requestAnimationFrame(() => { bar.style.transition = `width ${DICT_WAIT}s linear`; bar.style.width = "100%"; });
    for (let sec = DICT_WAIT - 1; sec >= 1; sec--) {
      dict.timers.push(setTimeout(() => {
        if (tk !== dict.token) return;
        const st = document.getElementById("dictStatus");
        if (st) st.textContent = `下一個：${sec} 秒`;
      }, (DICT_WAIT - sec) * 1000));
    }
    dict.timers.push(setTimeout(() => { if (tk !== dict.token) return; dict.idx++; playDict(tk); }, DICT_WAIT * 1000));
  });
}
function dictEnd() {
  const n = dict.items.length;
  dictBox.innerHTML = `
    <div class="card">
      <div class="dict-count">${n}<small> / ${n}</small></div>
      <div class="dots">${dict.items.map(() => '<span class="done"></span>').join("")}</div>
      <div class="dict-status">全部念完了！檢查一下你寫的字</div>
    </div>`;
  const r = document.createElement("div"); r.className = "row"; dictBox.appendChild(r);
  mkBtn(r, "再聽一次", "", runDict);
  mkBtn(r, "結束作答", "primary", dictAnswers);
  say("辛苦了！寫好就按結束作答", "happy");
}
function dictAnswers() {
  dict.token++;
  dictClearTimers();
  speechSynthesis.cancel();
  dictBox.innerHTML = '<p class="hint">答案（點一下可以聽發音）</p>';
  const list = document.createElement("div"); list.className = "words"; dictBox.appendChild(list);
  dict.items.forEach((item, i) => {
    const [w, kanji, mean] = item;
    const b = document.createElement("button");
    b.className = "word";
    b.innerHTML = `<span class="ans-no">${i + 1}</span>
      <span class="jp kana-font" lang="ja" style="min-width:100px">${pitchHTML(w)}</span>
      <span class="info"><div class="kanji" lang="ja">${kanji}</div><div class="ro">${wordRomaji(w)}</div><div class="mean">${mean}</div></span>${speakerSvg}`;
    b.onclick = () => speakWord(item);
    list.appendChild(b);
  });
  const r = document.createElement("div"); r.className = "row"; r.style.marginTop = "16px"; dictBox.appendChild(r);
  mkBtn(r, "再考一次", "primary", startDict);
  say("對答案囉！錯的字多聽幾次", "happy");
}

setLesson(0);

</script>
